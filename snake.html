<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>へびとりんご ― SNAKE &amp; APPLE</title>
<style>
  :root {
    --bg: #14210f;
    --bg2: #1d2d15;
    --ink: #f2f6e6;
    --dim: #9db08a;
    --line: rgba(255, 255, 255, 0.10);
    --panel: rgba(20, 33, 15, 0.92);
    --green: #7ec850;
    --green-d: #4e8f31;
    --red: #e8503a;
    --gold: #ffcf4a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(900px 620px at 50% -10%, rgba(126, 200, 80, 0.16), transparent 65%),
      radial-gradient(700px 500px at 88% 108%, rgba(232, 80, 58, 0.10), transparent 60%),
      linear-gradient(180deg, #16240f 0%, #10190c 60%, #0b1108 100%);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  #app {
    position: relative; width: 100%; height: 100%;
    max-width: 620px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: 10px 12px 12px;
  }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 8px; flex: none; }
  .brand { display: flex; flex-direction: column; line-height: 1.15; margin-right: auto; }
  .brand b { font-size: 16px; font-weight: 800; letter-spacing: 0.12em; }
  .brand small { font-size: 9px; letter-spacing: 0.26em; color: var(--dim); }
  .iconbtn {
    width: 36px; height: 36px; border-radius: 11px; font-size: 16px;
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line);
    display: grid; place-items: center; transition: background .2s, transform .1s;
  }
  .iconbtn:active { transform: scale(0.93); }
  .iconbtn:hover { background: rgba(255, 255, 255, 0.12); }

  /* ---------- stats ---------- */
  .stats { display: flex; gap: 7px; margin: 9px 0; flex: none; }
  .stat {
    flex: 1; padding: 7px 4px 8px; border-radius: 12px; text-align: center;
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line);
  }
  .stat .k { font-size: 9px; letter-spacing: 0.2em; color: var(--dim); }
  .stat .v { font-size: 19px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat.score .v { color: var(--gold); }
  .stat.len .v { color: var(--green); }
  .stat.apple .v { color: #ff8a72; }
  .stat .v.pop { animation: pop .34s ease; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.32); } 100% { transform: scale(1); } }

  /* ---------- board ---------- */
  .boardwrap {
    flex: 1; min-height: 0; display: grid; place-items: center; position: relative;
  }
  #board {
    display: block; border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    touch-action: none;
  }
  #board.shake { animation: shake .34s ease; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    45% { transform: translate(5px, -4px); }
    70% { transform: translate(-3px, -2px); }
  }

  /* ---------- d-pad ---------- */
  .pad { flex: none; margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; width: 210px; align-self: center; }
  .pad button {
    height: 50px; border-radius: 14px; font-size: 20px; color: var(--ink);
    background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line);
    display: grid; place-items: center; transition: background .12s, transform .08s;
  }
  .pad button:active { background: rgba(126, 200, 80, 0.32); transform: scale(0.94); }
  .pad .sp { visibility: hidden; }
  .keyhint { flex: none; margin-top: 10px; text-align: center; font-size: 10.5px; color: var(--dim); letter-spacing: 0.08em; }
  @media (pointer: fine) { .pad { display: none; } }
  @media (pointer: coarse) { .keyhint { display: none; } }
  @media (max-height: 560px) { .pad button { height: 42px; } .stats { margin: 6px 0; } }

  /* ---------- overlays ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 22px;
    background: rgba(9, 15, 7, 0.86); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    opacity: 0; pointer-events: none; transition: opacity .28s ease;
    text-align: center;
  }
  .overlay.on { opacity: 1; pointer-events: auto; }
  .overlay h1 {
    font-size: clamp(30px, 9vw, 46px); font-weight: 800; letter-spacing: 0.14em; line-height: 1.15;
    background: linear-gradient(100deg, #b8ec84 0%, #ffd66b 55%, #ff8a72 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .overlay .en { font-size: 10px; letter-spacing: 0.34em; color: var(--dim); margin-top: 8px; }
  .overlay .lead { margin-top: 16px; font-size: 13px; line-height: 2; color: #d8e6c8; }
  .overlay .lead b { color: var(--green); }
  .overlay .lead i { color: var(--red); font-style: normal; }

  .opts { margin-top: 18px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
  .opt { display: flex; align-items: center; gap: 8px; }
  .opt > span { font-size: 10.5px; letter-spacing: 0.16em; color: var(--dim); width: 62px; text-align: left; flex: none; }
  .seg { flex: 1; display: flex; gap: 6px; }
  .seg button {
    flex: 1; padding: 9px 4px; border-radius: 11px; font-size: 12px; font-weight: 700; color: var(--dim);
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); transition: all .18s;
  }
  .seg button.on { color: #0f1a0a; background: var(--green); border-color: var(--green); box-shadow: 0 6px 18px rgba(126, 200, 80, 0.28); }

  .cta {
    margin-top: 22px; padding: 15px 40px; border-radius: 999px;
    font-size: 15px; font-weight: 800; letter-spacing: 0.12em; color: #10190a;
    background: linear-gradient(100deg, #b8ec84, #7ec850);
    box-shadow: 0 12px 30px rgba(126, 200, 80, 0.3); transition: transform .12s, box-shadow .2s;
  }
  .cta:active { transform: translateY(2px) scale(0.98); box-shadow: 0 6px 16px rgba(126, 200, 80, 0.24); }
  .sub { margin-top: 14px; font-size: 11px; color: var(--dim); letter-spacing: 0.08em; }

  .result { margin-top: 16px; display: flex; gap: 10px; }
  .result div {
    min-width: 84px; padding: 12px 14px; border-radius: 14px;
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line);
  }
  .result .k { font-size: 9px; letter-spacing: 0.18em; color: var(--dim); }
  .result .v { font-size: 24px; font-weight: 800; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .cause { margin-top: 16px; font-size: 13px; color: #ffb4a4; letter-spacing: 0.06em; }
  .best { margin-top: 12px; font-size: 12px; color: var(--gold); letter-spacing: 0.1em; height: 16px; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><b>へびとりんご</b><small>SNAKE &amp; APPLE</small></div>
    <button class="iconbtn" id="btnSound" title="音">🔊</button>
    <button class="iconbtn" id="btnPause" title="ポーズ">⏸</button>
  </div>

  <div class="stats">
    <div class="stat score"><div class="k">SCORE</div><div class="v" id="vScore">0</div></div>
    <div class="stat apple"><div class="k">りんご</div><div class="v" id="vApple">0</div></div>
    <div class="stat len"><div class="k">ながさ</div><div class="v" id="vLen">3</div></div>
    <div class="stat"><div class="k">BEST</div><div class="v" id="vBest">0</div></div>
  </div>

  <div class="boardwrap"><canvas id="board"></canvas></div>

  <div class="pad">
    <button class="sp"></button><button data-dir="up">▲</button><button class="sp"></button>
    <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
  </div>
  <div class="keyhint">← ↑ ↓ → / WASD であやつる ・ SPACE でポーズ ・ R でやりなおし</div>

  <!-- title -->
  <div class="overlay on" id="ovTitle">
    <h1>へびとりんご</h1>
    <div class="en">SNAKE &amp; APPLE</div>
    <div class="lead">
      へびは <b>あたま・どう・しっぽ の3マス</b> からはじまる。<br>
      <i>りんご</i> をたべるたび <b>どうが1マスのびる</b>。<br>
      かべと じぶんのからだ には ぶつからないこと。
    </div>
    <div class="opts">
      <div class="opt"><span>はやさ</span><div class="seg" id="segSpeed">
        <button data-v="0">ゆっくり</button><button data-v="1" class="on">ふつう</button><button data-v="2">はやい</button>
      </div></div>
      <div class="opt"><span>かべ</span><div class="seg" id="segWall">
        <button data-v="1" class="on">あり</button><button data-v="0">なし(ループ)</button>
      </div></div>
    </div>
    <button class="cta" id="btnStart">はじめる</button>
    <div class="sub">スワイプ / 矢印キー ・ タップでもスタート</div>
  </div>

  <!-- pause -->
  <div class="overlay" id="ovPause">
    <h1>ポーズ</h1>
    <div class="lead">ひとやすみ。</div>
    <button class="cta" id="btnResume">つづける</button>
    <div class="sub" id="btnQuit" style="cursor:pointer">さいしょから</div>
  </div>

  <!-- game over -->
  <div class="overlay" id="ovOver">
    <h1 id="overTitle">おしまい</h1>
    <div class="cause" id="overCause"></div>
    <div class="result">
      <div><div class="k">SCORE</div><div class="v" id="rScore">0</div></div>
      <div><div class="k">りんご</div><div class="v" id="rApple">0</div></div>
      <div><div class="k">ながさ</div><div class="v" id="rLen">3</div></div>
    </div>
    <div class="best" id="rBest"></div>
    <button class="cta" id="btnRetry">もういちど</button>
    <div class="sub" id="btnHome" style="cursor:pointer">さいしょのがめんへ</div>
  </div>
</div>

<script>
"use strict";
(() => {
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const $ = id => document.getElementById(id);

  // ============================================================
  //  盤面の定数
  // ============================================================
  const COLS = 19, ROWS = 19;          // マス目
  const START_LEN = 3;                 // あたま・どう・しっぽ
  const SPEEDS = [                     // [初速ms, 最速ms, 1レベルの短縮ms]
    { base: 195, min: 125, dec: 7,  label: "ゆっくり" },
    { base: 150, min: 88,  dec: 6,  label: "ふつう" },
    { base: 108, min: 62,  dec: 5,  label: "はやい" },
  ];
  const APPLES_PER_LEVEL = 5;

  const DIRS = {
    up:    { x: 0, y: -1 },
    down:  { x: 0, y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1, y: 0 },
  };

  // ============================================================
  //  状態
  // ============================================================
  const S = {
    mode: "title",        // title / play / pause / over
    speed: 1,
    walls: true,
    snake: [],            // [0]=あたま … [n-1]=しっぽ
    moved: [],            // 各節がこのtickで動いた向き(補間用)
    dir: DIRS.right,
    queue: [],            // 入力バッファ(最大2)
    apple: null,
    apples: 0,
    score: 0,
    level: 1,
    acc: 0,               // tick用アキュムレータ
    t: 0,                 // 経過時間(秒)
    dead: 0,              // 死亡演出タイマー
    cause: "",
    fx: [],               // パーティクル
    pops: [],             // "+1" のふきだし
    eatFlash: 0,
    sound: true,
  };

  const bestKey = () => `snakeApple.best.v1.${S.speed}.${S.walls ? "wall" : "loop"}`;
  const readBest = () => { const v = parseInt(localStorage.getItem(bestKey()) || "0", 10); return isNaN(v) ? 0 : v; };
  const writeBest = v => { try { localStorage.setItem(bestKey(), String(v)); } catch (e) {} };

  // ============================================================
  //  Canvas
  // ============================================================
  const cv = $("board"), ctx = cv.getContext("2d");
  let cell = 20, boardPx = 400;

  function resize() {
    const wrap = cv.parentElement;
    const r = wrap.getBoundingClientRect();
    const size = Math.max(180, Math.floor(Math.min(r.width, r.height)) - 4);
    cell = Math.floor(size / COLS);
    boardPx = cell * COLS;
    const dpr = Math.min(devicePixelRatio || 1, 2.5);
    cv.width = boardPx * dpr; cv.height = cell * ROWS * dpr;
    cv.style.width = boardPx + "px"; cv.style.height = (cell * ROWS) + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize);

  // ============================================================
  //  音(WebAudio・依存なし)
  // ============================================================
  let ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function blip(freq, dur, type = "sine", vol = 0.16, slide = 0) {
    if (!S.sound) return;
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), a.currentTime + dur);
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, a.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  }
  const sndEat = () => { blip(620, 0.09, "triangle", 0.18, 320); setTimeout(() => blip(880, 0.1, "triangle", 0.13), 55); };
  const sndLevel = () => { [660, 880, 1100].forEach((f, i) => setTimeout(() => blip(f, 0.13, "sine", 0.13), i * 70)); };
  const sndDie = () => { blip(320, 0.5, "sawtooth", 0.14, -230); };
  const sndTurn = () => blip(240, 0.03, "square", 0.04);

  // ============================================================
  //  ゲームの進行
  // ============================================================
  function reset() {
    const cy = Math.floor(ROWS / 2), cx = Math.floor(COLS / 2) - 1;
    S.snake = [];
    for (let i = 0; i < START_LEN; i++) S.snake.push({ x: cx - i, y: cy });   // 頭→胴→尾
    S.moved = S.snake.map(() => ({ x: 0, y: 0 }));
    S.dir = DIRS.right;
    S.queue = [];
    S.apples = 0; S.score = 0; S.level = 1;
    S.acc = 0; S.dead = 0; S.cause = "";
    S.fx = []; S.pops = []; S.eatFlash = 0;
    placeApple();
    syncStats();
  }

  function occupied(x, y) {
    for (const s of S.snake) if (s.x === x && s.y === y) return true;
    return false;
  }

  function placeApple() {
    const free = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!occupied(x, y)) free.push({ x, y });
    if (!free.length) { S.apple = null; return false; }
    S.apple = free[(Math.random() * free.length) | 0];
    S.apple.born = S.t;
    return true;
  }

  const interval = () => {
    const sp = SPEEDS[S.speed];
    return Math.max(sp.min, sp.base - (S.level - 1) * sp.dec);
  };

  function pushDir(name) {
    const d = DIRS[name]; if (!d) return;
    if (S.mode === "title") { start(); }
    if (S.mode !== "play") return;
    const last = S.queue.length ? S.queue[S.queue.length - 1] : S.dir;
    if (d.x === last.x && d.y === last.y) return;              // 同じ向き
    if (d.x === -last.x && d.y === -last.y) return;            // 真後ろは不可
    if (S.queue.length >= 2) return;
    S.queue.push(d);
    sndTurn();
  }

  function step() {
    if (S.queue.length) S.dir = S.queue.shift();

    const head = S.snake[0];
    let nx = head.x + S.dir.x, ny = head.y + S.dir.y;

    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
      if (S.walls) return die("かべにぶつかった");
      nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS;
    }

    const eating = S.apple && S.apple.x === nx && S.apple.y === ny;
    // 尾は次のtickで動くので、しっぽのマスは(のびない限り)踏んでよい
    const limit = eating ? S.snake.length : S.snake.length - 1;
    for (let i = 0; i < limit; i++) if (S.snake[i].x === nx && S.snake[i].y === ny) return die("じぶんのからだをかんだ");

    const prev = S.snake.map(s => ({ x: s.x, y: s.y }));
    S.snake.unshift({ x: nx, y: ny });
    if (!eating) S.snake.pop();

    // 補間用: 各節の移動量(ループ時は最短の±1に丸める)
    S.moved = S.snake.map((s, i) => i < prev.length ? shortest(prev[i], s) : { x: 0, y: 0 });

    if (eating) {
      S.apples++;
      S.score += 10 * S.level;
      S.eatFlash = 1;
      burst(nx, ny);
      S.pops.push({ x: nx, y: ny, t: 0, txt: "+1" });
      sndEat();
      const nextLevel = 1 + Math.floor(S.apples / APPLES_PER_LEVEL);
      if (nextLevel > S.level) { S.level = nextLevel; sndLevel(); }
      if (!placeApple()) return clearGame();
      syncStats(true);
    }
  }

  function shortest(a, b) {
    let dx = b.x - a.x, dy = b.y - a.y;
    if (dx > 1) dx -= COLS; else if (dx < -1) dx += COLS;
    if (dy > 1) dy -= ROWS; else if (dy < -1) dy += ROWS;
    return { x: dx, y: dy };
  }

  function burst(gx, gy) {
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * TAU, sp = 40 + Math.random() * 130;
      S.fx.push({
        x: (gx + 0.5) * cell, y: (gy + 0.5) * cell,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        life: 0.5 + Math.random() * 0.35, age: 0,
        r: cell * (0.06 + Math.random() * 0.1),
        c: Math.random() < 0.75 ? "232,80,58" : "255,207,74",
      });
    }
    S.fx.push({ ring: true, x: (gx + 0.5) * cell, y: (gy + 0.5) * cell, age: 0, life: 0.42 });
  }

  function die(cause) {
    S.cause = cause;
    S.mode = "over";
    S.dead = 0;
    sndDie();
    cv.classList.remove("shake"); void cv.offsetWidth; cv.classList.add("shake");
    const b = readBest();
    const isBest = S.score > b;
    if (isBest) writeBest(S.score);
    setTimeout(() => showOver(isBest, false), 780);
  }

  function clearGame() {
    S.cause = "";
    S.mode = "over";
    const b = readBest();
    const isBest = S.score > b;
    if (isBest) writeBest(S.score);
    sndLevel();
    setTimeout(() => showOver(isBest, true), 500);
  }

  // ============================================================
  //  描画
  // ============================================================
  function gridToPx(v) { return (v + 0.5) * cell; }

  // ヘビをつないだ「ほどいた」座標列(ループ境界をまたいでも連続)
  function chain(t) {
    const n = S.snake.length;
    const raw = new Array(n);
    let cx = S.snake[0].x, cy = S.snake[0].y;
    raw[0] = { x: cx, y: cy };
    for (let i = 1; i < n; i++) {
      const d = shortest(S.snake[i - 1], S.snake[i]);
      cx += d.x; cy += d.y;
      raw[i] = { x: cx, y: cy };
    }
    const pts = new Array(n);
    for (let i = 0; i < n; i++) {
      const m = S.moved[i] || { x: 0, y: 0 };
      pts[i] = { x: gridToPx(raw[i].x - m.x * (1 - t)), y: gridToPx(raw[i].y - m.y * (1 - t)) };
    }
    return pts;
  }

  function drawField() {
    const W = COLS * cell, H = ROWS * cell;
    ctx.save();
    roundRect(0, 0, W, H, 16); ctx.clip();
    ctx.fillStyle = "#25401a"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#2b4a1e";
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if ((x + y) % 2 === 0) ctx.fillRect(x * cell, y * cell, cell, cell);
    }
    // やわらかい光
    const g = ctx.createRadialGradient(W * 0.35, H * 0.2, cell, W * 0.5, H * 0.5, W * 0.8);
    g.addColorStop(0, "rgba(190, 255, 150, 0.10)");
    g.addColorStop(1, "rgba(0, 0, 0, 0.28)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (S.eatFlash > 0) {
      ctx.fillStyle = `rgba(255, 220, 160, ${0.16 * S.eatFlash})`;
      ctx.fillRect(0, 0, W, H);
    }
    // かべ(ループ時は破線)
    ctx.lineWidth = 3;
    if (S.walls) {
      ctx.strokeStyle = "rgba(255, 255, 255, 0.16)"; ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = "rgba(126, 200, 80, 0.5)"; ctx.setLineDash([cell * 0.35, cell * 0.3]);
    }
    roundRect(1.5, 1.5, W - 3, H - 3, 15); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawApple() {
    if (!S.apple) return;
    const x = gridToPx(S.apple.x), y = gridToPx(S.apple.y);
    const age = S.t - (S.apple.born || 0);
    const pop = clamp(age / 0.22, 0, 1);
    const bob = Math.sin(S.t * 3.4) * cell * 0.04;
    const r = cell * 0.37 * (0.6 + 0.4 * pop) * (1 + (1 - pop) * 0.35);
    ctx.save();
    ctx.translate(x, y + bob);
    // 影
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.beginPath(); ctx.ellipse(0, r * 0.95 - bob * 0.6, r * 0.85, r * 0.28, 0, 0, TAU); ctx.fill();
    // 実
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.25);
    g.addColorStop(0, "#ff8367"); g.addColorStop(0.55, "#e8503a"); g.addColorStop(1, "#a8231a");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.72);
    ctx.bezierCurveTo(r * 1.15, -r * 1.15, r * 1.15, r * 0.72, 0, r * 0.95);
    ctx.bezierCurveTo(-r * 1.15, r * 0.72, -r * 1.15, -r * 1.15, 0, -r * 0.72);
    ctx.fill();
    // へた
    ctx.strokeStyle = "#7a4a24"; ctx.lineWidth = Math.max(1.6, r * 0.16); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, -r * 0.66); ctx.quadraticCurveTo(r * 0.12, -r * 1.05, r * 0.3, -r * 1.2); ctx.stroke();
    // 葉
    ctx.fillStyle = "#79c34a";
    ctx.save(); ctx.translate(r * 0.05, -r * 1.02); ctx.rotate(-0.5);
    ctx.beginPath(); ctx.ellipse(-r * 0.38, 0, r * 0.42, r * 0.2, 0, 0, TAU); ctx.fill(); ctx.restore();
    // ハイライト
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.36, r * 0.2, r * 0.12, -0.6, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // ヘビ本体(オフセットを与えるとループ時の“反対側”も描ける)
  function drawSnake(pts, ox, oy) {
    const n = pts.length;
    const W = cell * 0.76;
    const p = pts.map(q => ({ x: q.x + ox, y: q.y + oy }));

    // 死亡時はほんのり赤く
    const dying = S.mode === "over" && S.cause;
    const bodyTop = dying ? "#c05a4a" : "#8fd964";
    const bodyBottom = dying ? "#7e3226" : "#3f7a28";

    // 影
    ctx.save(); ctx.translate(2.5, 3.5);
    strokeBody(p, W, "rgba(0,0,0,0.30)");
    ctx.restore();

    // ふちどり → 本体
    strokeBody(p, W + 5, dying ? "#5d2018" : "#22461a");
    const g = ctx.createLinearGradient(0, 0, 0, ROWS * cell);
    g.addColorStop(0, bodyTop); g.addColorStop(1, bodyBottom);
    strokeBody(p, W, g);

    // うろこ / お腹のライン
    ctx.save();
    ctx.lineWidth = Math.max(1, W * 0.1); ctx.lineCap = "round";
    for (let i = 1; i < n - 1; i++) {
      const a = p[i - 1], b = p[i + 1];
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      ctx.save(); ctx.translate(p[i].x, p[i].y); ctx.rotate(ang);
      ctx.strokeStyle = i % 2 === 0 ? "rgba(255,255,255,0.13)" : "rgba(0,0,0,0.10)";
      ctx.beginPath(); ctx.arc(0, 0, W * 0.3, -1.0, 1.0); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    drawHead(p, W, dying);
  }

  function strokeBody(p, w, style) {
    const n = p.length;
    ctx.save();
    ctx.strokeStyle = style; ctx.fillStyle = style;
    ctx.lineWidth = w; ctx.lineJoin = "round"; ctx.lineCap = "round";
    // 胴(あたま〜しっぽの1つ手前)
    ctx.beginPath();
    ctx.moveTo(p[0].x, p[0].y);
    for (let i = 1; i <= n - 2; i++) ctx.lineTo(p[i].x, p[i].y);
    if (n === 2) ctx.lineTo(p[1].x, p[1].y);
    ctx.stroke();
    // しっぽ(先細り)
    if (n >= 2) {
      const a = p[n - 2], b = p[n - 1];
      let dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;
      const px = -dy, py = dx, hw = w / 2;
      ctx.beginPath();
      ctx.moveTo(a.x + px * hw, a.y + py * hw);
      ctx.quadraticCurveTo(b.x + px * hw * 0.55, b.y + py * hw * 0.55, b.x + dx * hw * 0.35, b.y + dy * hw * 0.35);
      ctx.quadraticCurveTo(b.x - px * hw * 0.55, b.y - py * hw * 0.55, a.x - px * hw, a.y - py * hw);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawHead(p, W, dying) {
    const h = p[0], nx = p[1] || { x: h.x - cell, y: h.y };
    const ang = Math.atan2(h.y - nx.y, h.x - nx.x);
    const R = W * 0.7;
    ctx.save();
    ctx.translate(h.x, h.y); ctx.rotate(ang);

    // あたま(すこし前に伸びた楕円)
    ctx.fillStyle = dying ? "#5d2018" : "#22461a";
    ctx.beginPath(); ctx.ellipse(R * 0.12, 0, R * 1.16, R * 1.04, 0, 0, TAU); ctx.fill();
    const g = ctx.createLinearGradient(0, -R, 0, R);
    g.addColorStop(0, dying ? "#d4705e" : "#a6ea78"); g.addColorStop(1, dying ? "#a9422f" : "#5aa338");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(R * 0.12, 0, R * 0.98, R * 0.86, 0, 0, TAU); ctx.fill();

    // した(ときどきチロチロ)
    const flick = (S.t * 2) % 1;
    if (!dying && flick < 0.22) {
      const out = R * (1.1 + flick * 1.6);
      ctx.strokeStyle = "#ff5f7a"; ctx.lineWidth = Math.max(1.4, R * 0.16); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(R * 0.95, 0); ctx.lineTo(out, 0); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(out, 0); ctx.lineTo(out + R * 0.32, -R * 0.24);
      ctx.moveTo(out, 0); ctx.lineTo(out + R * 0.32, R * 0.24);
      ctx.stroke();
    }

    // め
    for (const s of [-1, 1]) {
      const ex = R * 0.42, ey = s * R * 0.42;
      if (dying) {
        ctx.strokeStyle = "#2a1008"; ctx.lineWidth = Math.max(1.6, R * 0.17); ctx.lineCap = "round";
        const q = R * 0.2;
        ctx.beginPath(); ctx.moveTo(ex - q, ey - q); ctx.lineTo(ex + q, ey + q);
        ctx.moveTo(ex + q, ey - q); ctx.lineTo(ex - q, ey + q); ctx.stroke();
      } else {
        ctx.fillStyle = "#fffdf3";
        ctx.beginPath(); ctx.ellipse(ex, ey, R * 0.3, R * 0.28, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = "#20301a";
        ctx.beginPath(); ctx.ellipse(ex + R * 0.1, ey, R * 0.14, R * 0.19, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath(); ctx.arc(ex + R * 0.04, ey - R * 0.1, R * 0.06, 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawFx(dt) {
    for (let i = S.fx.length - 1; i >= 0; i--) {
      const f = S.fx[i];
      f.age += dt;
      if (f.age >= f.life) { S.fx.splice(i, 1); continue; }
      const k = f.age / f.life;
      if (f.ring) {
        ctx.strokeStyle = `rgba(255, 220, 160, ${(1 - k) * 0.7})`;
        ctx.lineWidth = cell * 0.1 * (1 - k) + 1;
        ctx.beginPath(); ctx.arc(f.x, f.y, cell * (0.25 + k * 0.9), 0, TAU); ctx.stroke();
      } else {
        f.vy += 420 * dt;
        f.x += f.vx * dt; f.y += f.vy * dt;
        ctx.fillStyle = `rgba(${f.c}, ${1 - k})`;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - k * 0.5), 0, TAU); ctx.fill();
      }
    }
    for (let i = S.pops.length - 1; i >= 0; i--) {
      const q = S.pops[i];
      q.t += dt;
      if (q.t > 0.85) { S.pops.splice(i, 1); continue; }
      const k = q.t / 0.85;
      ctx.save();
      ctx.globalAlpha = 1 - k * k;
      ctx.fillStyle = "#ffd66b";
      ctx.font = `800 ${Math.max(12, cell * 0.8)}px "Hiragino Maru Gothic ProN", system-ui, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(q.txt, gridToPx(q.x), gridToPx(q.y) - cell * (0.3 + k * 1.4));
      ctx.restore();
    }
  }

  function render(dt) {
    ctx.clearRect(0, 0, COLS * cell, ROWS * cell);
    drawField();

    ctx.save();
    roundRect(0, 0, COLS * cell, ROWS * cell, 16); ctx.clip();

    drawApple();

    const t = S.mode === "play" ? clamp(S.acc / interval(), 0, 1) : 1;
    const pts = chain(t);
    if (S.walls) {
      drawSnake(pts, 0, 0);
    } else {
      // ループ時は上下左右の“となり”にも同じヘビを描いて、はみ出しをつなぐ
      const W = COLS * cell, H = ROWS * cell;
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) drawSnake(pts, ox * W, oy * H);
    }
    drawFx(dt);
    ctx.restore();
  }

  // ============================================================
  //  ループ
  // ============================================================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    S.t += dt;
    if (S.eatFlash > 0) S.eatFlash = Math.max(0, S.eatFlash - dt * 3.2);

    if (S.mode === "play") {
      S.acc += dt * 1000;
      let guard = 4;
      while (S.mode === "play" && S.acc >= interval() && guard-- > 0) {
        S.acc -= interval();
        step();
      }
    }
    render(dt);
    requestAnimationFrame(frame);
  }

  // ============================================================
  //  UI
  // ============================================================
  function syncStats(pop) {
    $("vScore").textContent = S.score;
    $("vApple").textContent = S.apples;
    $("vLen").textContent = S.snake.length;
    $("vBest").textContent = readBest();
    if (pop) ["vScore", "vApple", "vLen"].forEach(id => {
      const el = $(id); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    });
  }

  const show = (id, on) => $(id).classList.toggle("on", on);

  function start() {
    reset();
    show("ovTitle", false); show("ovPause", false); show("ovOver", false);
    S.mode = "play";
    S.acc = 0;
    audio();
  }

  function showOver(isBest, cleared) {
    $("overTitle").textContent = cleared ? "コンプリート！" : "おしまい";
    $("overCause").textContent = cleared ? "ばんめんを ぜんぶ うめつくした。" : S.cause;
    $("rScore").textContent = S.score;
    $("rApple").textContent = S.apples;
    $("rLen").textContent = S.snake.length;
    $("rBest").textContent = isBest ? "★ ハイスコア更新！" : `BEST ${readBest()}`;
    syncStats();
    show("ovOver", true);
  }

  function pause() {
    if (S.mode !== "play") return;
    S.mode = "pause"; show("ovPause", true);
  }
  function resume() {
    if (S.mode !== "pause") return;
    S.mode = "play"; S.acc = 0; show("ovPause", false);
  }
  function home() {
    S.mode = "title"; reset();
    show("ovPause", false); show("ovOver", false); show("ovTitle", true);
  }

  // ボタン
  $("btnStart").onclick = start;
  $("btnRetry").onclick = start;
  $("btnResume").onclick = resume;
  $("btnQuit").onclick = home;
  $("btnHome").onclick = home;
  $("btnPause").onclick = () => (S.mode === "play" ? pause() : resume());
  $("btnSound").onclick = () => {
    S.sound = !S.sound;
    $("btnSound").textContent = S.sound ? "🔊" : "🔇";
    try { localStorage.setItem("snakeApple.sound", S.sound ? "1" : "0"); } catch (e) {}
    if (S.sound) blip(760, 0.08, "sine", 0.12);
  };
  if (localStorage.getItem("snakeApple.sound") === "0") { S.sound = false; $("btnSound").textContent = "🔇"; }

  function seg(id, cb) {
    const box = $(id);
    box.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      [...box.children].forEach(c => c.classList.toggle("on", c === b));
      cb(parseInt(b.dataset.v, 10));
    });
  }
  seg("segSpeed", v => { S.speed = v; syncStats(); });
  seg("segWall", v => { S.walls = !!v; syncStats(); });

  // キーボード
  const KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    W: "up", S: "down", A: "left", D: "right",
  };
  addEventListener("keydown", e => {
    if (KEYS[e.key]) { e.preventDefault(); pushDir(KEYS[e.key]); return; }
    if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      if (S.mode === "title" || S.mode === "over") start();
      else if (S.mode === "play") pause(); else resume();
    }
    if (e.key === "r" || e.key === "R") { e.preventDefault(); start(); }
  }, { passive: false });

  // タッチ(スワイプ)
  let tx = 0, ty = 0, tracking = false;
  cv.addEventListener("touchstart", e => {
    tracking = true; tx = e.touches[0].clientX; ty = e.touches[0].clientY;
    if (S.mode === "title") start();
  }, { passive: true });
  cv.addEventListener("touchmove", e => {
    if (!tracking) return;
    const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
    const th = 22;
    if (Math.abs(dx) < th && Math.abs(dy) < th) return;
    pushDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  cv.addEventListener("touchend", () => { tracking = false; }, { passive: true });

  // 十字キー
  document.querySelector(".pad").addEventListener("pointerdown", e => {
    const b = e.target.closest("button[data-dir]"); if (!b) return;
    e.preventDefault(); pushDir(b.dataset.dir);
  });

  // タイトルはどこをタップしても開始
  $("ovTitle").addEventListener("click", e => {
    if (e.target.closest("button")) return;
    start();
  });

  // 画面が隠れたら自動ポーズ
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

  // ============================================================
  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
