<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>漂流 ― HYORYU</title>
<style>
  :root{
    --ink:#e8e2d6; --dim:#9b9483; --line:#2c2f36; --bg:#0b0d11; --panel:#14171d;
    --gold:#e2c98a; --warn:#e28a5a; --crit:#d6533f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  button{user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation}
  .pad button{touch-action:none}
  .journal,.prompt,.topbar,.pack{user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
  html,body{height:100%; margin:0; overflow:hidden}
  body{
    background:var(--bg); color:var(--ink); font-size:15px;
    font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
    -webkit-font-smoothing:antialiased; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  #app{position:fixed; inset:0; overflow:hidden}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block}

  /* ───────── HUD : B案 額縁型 ───────── */
  .hud{position:absolute; inset:0; pointer-events:none; font-family:'Hiragino Sans','Noto Sans JP',system-ui,sans-serif}
  .hud > *{position:absolute}

  .topbar{
    top:0; left:0; right:0; height:38px; display:flex; align-items:center; gap:14px;
    padding:0 14px; font-size:12px; letter-spacing:.14em; color:#ded7c9;
    background:linear-gradient(#05070ad9,#05070a00); text-shadow:0 1px 4px #000;
  }
  .topbar .day{color:#fff; letter-spacing:.2em}
  .topbar .clock{color:var(--gold); letter-spacing:.1em; font-variant-numeric:tabular-nums}
  .topbar .wx{opacity:.85}
  .load{margin-left:auto; font-size:11px; letter-spacing:.08em; color:#b8b1a0; font-variant-numeric:tabular-nums}
  .load.over{color:var(--warn)}
  .vit{margin-left:14px; display:flex; gap:9px; letter-spacing:0}
  .vit b{
    width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px;
    background:rgba(6,8,12,.5); border:1px solid rgba(255,255,255,.13); font-weight:400; transition:.3s;
  }
  .vit b.w{border-color:rgba(226,138,90,.9); box-shadow:0 0 10px rgba(226,138,90,.35)}
  .vit b.c{border-color:rgba(214,83,63,.95); box-shadow:0 0 12px rgba(214,83,63,.55); animation:pul 1.3s infinite}
  @keyframes pul{50%{opacity:.4}}

  .journal{
    left:0; right:0; bottom:0; padding:16px 18px 16px; min-height:74px;
    background:linear-gradient(#05070a00,#04060af2 42%);
    font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
    font-size:14px; line-height:1.95; color:#ded7c9;
  }
  .journal div{transition:opacity .5s}
  .journal .o2{opacity:.22} .journal .o1{opacity:.45} .journal .o0{color:#fff}

  .prompt{
    left:50%; transform:translateX(-50%); bottom:104px; white-space:nowrap;
    color:#fff; font-size:13px; letter-spacing:.1em; text-shadow:0 1px 6px #000;
    border-bottom:1px solid rgba(255,255,255,.3); padding-bottom:4px; opacity:0; transition:.18s;
  }
  .prompt.on{opacity:.95}
  .prompt .k{color:var(--gold); margin-right:8px}

  .pack{right:14px; bottom:108px; display:flex; gap:5px; flex-wrap:wrap-reverse; justify-content:flex-end; max-width:46%}
  .pack i{
    width:29px; height:29px; border:1px solid rgba(255,255,255,.15); border-radius:2px; position:relative;
    background:rgba(8,10,14,.55); display:grid; place-items:center; font-style:normal; font-size:14px;
  }
  .pack i.q{border-style:dashed; border-color:#6b5731; color:var(--gold); font-size:12px}
  .pack i s{position:absolute; right:1px; bottom:0; font-size:9px; text-decoration:none; color:#cfc7b4; text-shadow:0 1px 2px #000}

  /* ───────── 操作ボタン（触っても遊べるように） ───────── */
  .pad{pointer-events:auto; position:absolute; bottom:16px; display:none; gap:8px}
  @media (pointer:coarse){
    .pad{display:flex}
    .journal{padding-bottom:72px !important}
    .prompt{bottom:126px !important}
    .pack{bottom:130px !important}
  }
  .pad.l{left:12px} .pad.r{right:12px}
  .pad button, .menub{
    width:46px; height:46px; border-radius:50%; border:1px solid rgba(255,255,255,.16);
    background:rgba(8,10,14,.5); color:#e8e2d6; font-size:17px; font-family:inherit; cursor:pointer;
    display:grid; place-items:center; backdrop-filter:blur(3px);
  }
  .pad button:active{background:rgba(255,255,255,.16)}
  .keys{top:44px; right:12px; display:flex; gap:6px; pointer-events:auto}
  .menub{width:34px; height:34px; font-size:13px; border-radius:3px}

  /* ───────── パネル ───────── */
  .mapmode .journal{opacity:0}
  @media (orientation:portrait){ .mapmode canvas{height:100%} .mapmode .vignette{bottom:0} }
  .mapmode .prompt,.mapmode .pack,.mapmode .pad{display:none !important}
  .maphint{
    left:50%; transform:translateX(-50%); bottom:20px; text-align:center; color:#c2bbaa;
    font-size:11.5px; letter-spacing:.13em; text-shadow:0 1px 6px #000; line-height:1.95; width:92%;
  }
  .maphint b{color:var(--gold); font-weight:400}
  .scrim{
    position:absolute; inset:0; background:rgba(4,6,10,.78); pointer-events:auto;
    display:none; align-items:center; justify-content:center; padding:24px; backdrop-filter:blur(4px);
  }
  .scrim.on{display:flex}
  .panel{
    width:min(720px,100%); max-height:100%; overflow-y:auto; background:var(--panel);
    border:1px solid var(--line); border-radius:4px; padding:22px 24px 26px;
    font-family:'Hiragino Sans','Noto Sans JP',system-ui,sans-serif; font-size:13px; line-height:1.85;
  }
  .panel h2{
    margin:0 0 16px; font-size:14px; letter-spacing:.3em; font-weight:600; color:#fff;
    border-bottom:1px solid var(--line); padding-bottom:11px; display:flex; align-items:center;
  }
  .panel h2 span{margin-left:auto; font-size:11px; letter-spacing:.1em; color:var(--dim); font-weight:400}
  .panel h3{margin:18px 0 8px; font-size:12px; letter-spacing:.2em; color:var(--gold); font-weight:600}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:7px}
  .cell{
    border:1px solid var(--line); border-radius:3px; padding:8px 10px; background:#0f1218;
    display:flex; gap:9px; align-items:center; cursor:pointer; transition:.13s; text-align:left;
    color:var(--ink); font:inherit;
  }
  .cell:hover:not(:disabled){border-color:#5a6272; background:#171b23}
  .cell:disabled{opacity:.38; cursor:default}
  .cell u{font-size:17px; text-decoration:none; flex:0 0 auto}
  .cell .nm{font-size:12px; line-height:1.5}
  .cell .sub{font-size:10.5px; color:var(--dim); letter-spacing:.02em}
  .cell.q{border-style:dashed; border-color:#6b5731}
  .cell .ct{margin-left:auto; color:var(--dim); font-size:11px}
  .close{
    margin-top:20px; width:100%; padding:10px; background:#1b1f27; border:1px solid var(--line);
    color:var(--dim); border-radius:3px; cursor:pointer; font:inherit; font-size:12px; letter-spacing:.2em;
  }
  .close:hover{color:#fff; border-color:#5a6272}
  .bars{display:grid; grid-template-columns:auto 1fr auto; gap:6px 12px; align-items:center; font-size:12px}
  .bars .bg{height:5px; background:#0a0c11; border-radius:3px; overflow:hidden}
  .bars .bg i{display:block; height:100%; border-radius:3px; transition:width .4s}
  .lv{letter-spacing:.14em; color:var(--gold); font-size:11px}
  .memo{color:var(--dim); font-size:12px; line-height:1.95; margin:2px 0 0}
  .memo b{color:var(--ink); font-weight:600}
  .rec{color:#8a8375; font-size:10.5px}
  .ok{color:#8fbf90} .ng{color:#c98d7a}

  .diaryline{border-left:1px solid #2b2f38; padding:2px 0 2px 13px; margin:0 0 3px; color:#b9b2a2; font-size:12px}
  .diaryline b{color:var(--gold); font-weight:400; letter-spacing:.1em; margin-right:9px; font-size:11px}

  /* ───────── タイトル / エンディング ───────── */
  .curtain{
    position:absolute; inset:0; pointer-events:auto; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:30px;
    background:radial-gradient(ellipse at center,#0d1018 0%,#04060a 75%);
  }
  .curtain.on{display:flex}
  .curtain h1{
    font-size:min(13vw,54px); letter-spacing:.5em; margin:0 0 6px; font-weight:400; text-indent:.5em;
    color:#f0e9da; text-shadow:0 0 34px rgba(226,201,138,.28);
  }
  .curtain .sub{font-size:11px; letter-spacing:.55em; color:#6f6a5e; margin-bottom:38px; text-indent:.55em}
  .curtain .desc{max-width:600px; color:#a9a294; font-size:13px; line-height:2.15; margin-bottom:30px;
    font-family:'Hiragino Sans','Noto Sans JP',system-ui,sans-serif}
  .btn{
    display:block; width:min(320px,80vw); margin:0 auto 9px; padding:13px; cursor:pointer;
    background:transparent; border:1px solid #3b414e; color:#ded7c9; border-radius:3px;
    font:inherit; font-size:13px; letter-spacing:.28em; transition:.18s; text-indent:.28em;
  }
  .btn:hover{background:#e8e2d6; color:#12141a; border-color:#e8e2d6}
  .btn.sm{font-size:11px; padding:9px; color:#7d7768; letter-spacing:.2em}
  .btn.sm:hover{background:#22262f; color:#ded7c9; border-color:#4b5260}
  .endtitle{font-size:min(9vw,34px); letter-spacing:.32em; color:#f0e9da; margin:0 0 4px; text-indent:.32em}
  .endkind{font-size:11px; letter-spacing:.4em; margin-bottom:26px}
  .fade{position:absolute; inset:0; background:#04060a; opacity:0; pointer-events:none; transition:opacity 1.1s}
  .fade.on{opacity:1}
  .vignette{position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,transparent 46%,rgba(3,4,8,.55) 100%)}
  .toast{
    left:50%; transform:translateX(-50%); top:56px; padding:9px 20px; border-radius:2px;
    background:rgba(6,8,12,.82); border:1px solid #39404e; color:var(--gold);
    font-size:12px; letter-spacing:.16em; opacity:0; transition:.35s;
    font-family:'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  }
  .toast.on{opacity:1}
  /* 縦長の画面では、島を上段に寄せて下段を手記にあてる */
  @media (orientation:portrait){
    canvas{height:64%}
    .journal{top:64%; bottom:0; padding:14px 16px 8px;
      background:#05070b; border-top:1px solid #1b1f27; overflow:hidden;
      display:flex; flex-direction:column; justify-content:flex-end}
    .journal div{margin-bottom:5px; flex:0 0 auto}
    .journal::after{content:''; display:block; flex:0 0 auto; height:62px}
    .prompt{bottom:calc(36% + 48px) !important}
    .pack{bottom:calc(36% + 10px) !important; max-width:74%}
    .vignette{bottom:36%}
  }
  @media (max-width:440px){
    .topbar{font-size:10.5px; gap:9px; letter-spacing:.06em}
    .load{font-size:10px}
    .vit{margin-left:8px; gap:6px}
    .vit b{width:21px; height:21px; font-size:11px}
  }
  @media (max-width:560px){
    .panel{padding:18px 15px 20px}
    .journal{font-size:12.5px; padding:13px 14px}
    .prompt{bottom:104px; font-size:12px}
    .grid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="vignette"></div>

  <div class="hud">
    <div class="topbar">
      <span class="day" id="uiDay">1日目</span>
      <span class="clock" id="uiClock">6:00</span>
      <span class="wx" id="uiWx">晴</span>
      <span class="load" id="uiLoad"></span>
      <span class="vit" id="uiVit"></span>
    </div>
    <div class="prompt" id="uiPrompt"><span class="k">E</span><span id="uiPromptTx"></span></div>
    <div class="pack" id="uiPack"></div>
    <div class="journal" id="uiJournal"></div>
    <div class="keys">
      <button class="menub" id="bMap" title="島の見取図 (M)">地</button>
      <button class="menub" id="bInv" title="持ち物 (I)">物</button>
      <button class="menub" id="bCraft" title="こしらえる (C)">作</button>
      <button class="menub" id="bDiary" title="日誌 (J)">誌</button>
      <button class="menub" id="bMenu" title="menu (Esc)">≡</button>
    </div>
    <div class="pad l"><button id="bL">←</button><button id="bR">→</button></div>
    <div class="pad r"><button id="bE">✋</button></div>
    <div class="maphint" id="uiMapHint" style="display:none"></div>
    <div class="toast" id="uiToast"></div>
  </div>

  <div class="scrim" id="scrim"><div class="panel" id="panel"></div></div>
  <div class="curtain" id="curtain"></div>
  <div class="fade" id="fade"></div>
</div>

<script>
"use strict";
/* =========================================================================
   漂流 ― HYORYU
   無人島ローグライク / 地点をめぐる / マルチエンディング
   単一HTML・依存ライブラリなし
   ========================================================================= */

/* ───────── 乱数 ───────── */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=mulberry32(1);                       // 島の生成用
let Q=mulberry32(Date.now()&0xffffff);     // その場の判定用
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const shuffle=(r,a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const chance=p=>Q()<p;
function wpick(r,tbl){                     // {key:weight} から一つ引く
  let t=0; for(const k in tbl) t+=tbl[k];
  let v=r()*t;
  for(const k in tbl){ v-=tbl[k]; if(v<=0) return k }
  return Object.keys(tbl)[0];
}

/* ───────── 定数 ───────── */
const MAX_DAY=40, DAWN=5, DUSK=19, WAKE=6;
const GY=0.70;
const CAP0=13;                             // 素手で持てる重さ

/* ───────── 品目 ───────── */
const ITEM={
  wood  :{n:'流木',   i:'🪵',w:1}, timber:{n:'角材',  i:'🪵',w:3}, stone :{n:'石',    i:'🪨',w:2},
  fiber :{n:'繊維',   i:'🌾',w:1}, leaf  :{n:'大葉',  i:'🍃',w:1}, resin :{n:'樹脂',  i:'🟠',w:1},
  clay  :{n:'粘土',   i:'🟤',w:2}, metal :{n:'金属片',i:'⚙️',w:1}, cloth :{n:'布',    i:'🧵',w:1},
  bone  :{n:'骨',     i:'🦴',w:1}, shell :{n:'貝',    i:'🐚',w:1}, salt  :{n:'塩',    i:'🧂',w:1},
  coco  :{n:'椰子の実',i:'🥥',w:2}, fish  :{n:'魚',    i:'🐟',w:1}, meat  :{n:'生肉',  i:'🥩',w:2},
  hide  :{n:'毛皮',   i:'🟫',w:2}, dried :{n:'干物',  i:'🍖',w:1}, cooked:{n:'焼いた身',i:'🍗',w:1},
  herb  :{n:'薬草',   i:'🌿',w:1}, egg   :{n:'海鳥の卵',i:'🥚',w:1}, water :{n:'水',   i:'💧',w:2},
  tin   :{n:'缶詰',   i:'🥫',w:1}, seed  :{n:'種',    i:'🌱',w:1}, bamboo:{n:'竹',    i:'🎍',w:2},
  chart :{n:'海図の断片',i:'🗺️',w:1}, relic:{n:'遺品', i:'📿',w:1}, parts :{n:'無線の部品',i:'📻',w:2},
  axe   :{n:'石斧',   i:'🪓',w:2,t:1}, machete:{n:'山刀',i:'🔪',w:2,t:1}, spear:{n:'銛',i:'🔱',w:2,t:1},
  rod   :{n:'釣竿',   i:'🎣',w:2,t:1}, rope :{n:'綱',   i:'🪢',w:2,t:1}, torch:{n:'松明',i:'🔥',w:1},
  pot   :{n:'土器',   i:'🏺',w:2,t:1}, still:{n:'蒸留器',i:'⚗️',w:3,t:1}, lamp:{n:'角灯',i:'🏮',w:2,t:1},
  radio :{n:'無線機', i:'📡',w:3,t:1}, basket:{n:'編み籠',i:'🧺',w:1,t:1}, frame:{n:'背負子',i:'🎒',w:2,t:1},
  knife :{n:'貝の刃', i:'🔪',w:1,t:1}
};
/* 未鑑定：見た目と効き目の対応は毎周シャッフルされる */
const UNK=[
  {id:'n1',n:'赤い実',   i:'🔴'},{id:'n2',n:'青い実',  i:'🔵'},{id:'n3',n:'黒い実', i:'⚫'},
  {id:'n4',n:'白い実',   i:'⚪'},{id:'n5',n:'縞の実',  i:'🟣'},
  {id:'m1',n:'白い茸',   i:'🍄'},{id:'m2',n:'赤い茸',  i:'🍄'},{id:'m3',n:'斑の茸', i:'🍄'}
];
const NUTS=['n1','n2','n3','n4','n5'], MUSH=['m1','m2','m3'];
const EFFECT={
  nutri :{n:'滋養',   d:'よく腹に溜まる',       f:s=>{s.food+=34;lg('腹に力が戻る。')}},
  juicy :{n:'水気',   d:'喉を潤す',             f:s=>{s.water+=30;s.food+=8;lg('喉の渇きがすこし引いた。')}},
  poison:{n:'毒',     d:'内臓を灼く',           f:s=>{s.hp-=22;s.food-=10;s.sick=3;lg('喉が灼ける。手が震えだした。','bad')}},
  numb  :{n:'痺れ',   d:'手足の感覚を奪う',     f:s=>{s.hp-=9;s.numb=2;lg('指の感覚が遠い。','bad')}},
  halluc:{n:'幻覚',   d:'見えないものを見せる', f:s=>{s.san-=16;s.food+=10;lg('葉の影が、人の手のように動いた。','bad')}},
  calm  :{n:'鎮静',   d:'心をなだめる',         f:s=>{s.san+=22;lg('胸の底のざわつきが、すこし静まる。','good')}},
  cure  :{n:'薬',     d:'熱と痛みを引かせる',   f:s=>{s.hp+=20;s.sick=0;lg('熱がひいていく。','good')}},
  bitter:{n:'苦味',   d:'ただ苦いだけ',         f:s=>{s.food+=6;lg('えぐみだけが舌に残った。')}}
};
const EFFKEYS=Object.keys(EFFECT);

/* ───────── こしらえもの ───────── */
const RECIPE=[
  {id:'knife', n:'貝の刃', c:{shell:2,fiber:1},            sk:'craft', lv:0, t:30, d:'ないよりはましな刃'},
  {id:'axe',   n:'石斧',   c:{stone:2,wood:1,fiber:2},     sk:'craft', lv:0, t:60, d:'木を伐り倒せるようになる'},
  {id:'basket',n:'編み籠', c:{fiber:5},                    sk:'gather',lv:1, t:50, d:'荷を6ぶん多く持てる'},
  {id:'rope',  n:'綱',     c:{fiber:4},                    sk:'gather',lv:1, t:40, d:'崖を降り、筏を縛る'},
  {id:'torch', n:'松明',   c:{wood:1,fiber:1,resin:1},     sk:'craft', lv:0, t:30, d:'暗がりと夜を照らす'},
  {id:'spear', n:'銛',     c:{wood:2,stone:1,fiber:1},     sk:'craft', lv:1, t:60, d:'獣と魚に届く'},
  {id:'rod',   n:'釣竿',   c:{wood:1,fiber:2},             sk:'fish',  lv:0, t:40, d:'魚が釣れるようになる'},
  {id:'frame', n:'背負子', c:{timber:2,rope:1,fiber:3},    sk:'craft', lv:2, t:80, d:'荷を10ぶん多く持てる'},
  {id:'machete',n:'山刀',  c:{metal:1,wood:1,fiber:1},     sk:'craft', lv:2, t:80, d:'藪を斬り開ける'},
  {id:'pot',   n:'土器',   c:{clay:3},                     sk:'craft', lv:1, t:80, d:'水を運び、煮炊きできる', fire:1},
  {id:'still', n:'蒸留器', c:{pot:1,metal:1,fiber:2},      sk:'craft', lv:3, t:120,d:'海水から真水を採る'},
  {id:'lamp',  n:'角灯',   c:{metal:1,cloth:1,resin:2},    sk:'craft', lv:3, t:90, d:'消えない灯り'},

  {id:'salt',  n:'塩',     c:{water:1},                    sk:'craft', lv:0, t:50, d:'海水を煮つめる',  fire:1, shore:1},

const DIRN=['東','東南','南','南西','西','北西','北','北東'];
function dirName(a){ return DIRN[Math.round(a/(Math.PI/4))&7] }

/* ───────── 島（周回ごとにシードで生成） ───────── */
function genIsland(seed){
  R=mulberry32(seed);
  const locs=[];
  const add=(kind,ring,ang)=>{
    const K=KIND[kind], id=locs.length;
    const rad=[0,0.36,0.62,0.84,1.0][ring];
    const L={id,kind,ring,ang, mx:Math.cos(ang)*rad, my:Math.sin(ang)*rad*0.74,
      adj:[], seen:ring<=1?1:0, visited:0, rich:70+R()*30, sd:R()*99,
      len:K.len, spots:[], name:(ring?dirName(ang)+'の':'')+K.n};
    const ns=ri(R,3,5);
    for(let i=0;i<ns;i++) L.spots.push({x:Math.round(120+ (i+R()*.7)*(K.len-220)/ns), left:ri(R,2,3), max:3, sd:R()});
    locs.push(L); return L;
  };
  // 起点：漂着した浜
  add('shore',0,0);
  // 各輪の顔ぶれ。水場・眺望・浜は必ずどこかに入る
  const pool1=shuffle(R,['jungle','grove','thicket','rocky','bamboo','dune']);
  const pool2=shuffle(R,['jungle','marsh','fall','spring','cave','trail','thicket','rocky','tidepool','bamboo']);
  const pool3=shuffle(R,['cave','cliff','wreck','ruinhut','trail','marsh','cape','fall','tidepool']);
  const pool4=shuffle(R,['ruins','cliff','wreck','cave','cape']);
  const ringOf=[[],[],[],[],[]];
  const mk=(ring,list,n)=>{
    const base=R()*6.283;
    for(let i=0;i<n;i++){
      const ang=base+(i+ (R()-.5)*.5)*6.283/n;
      ringOf[ring].push(add(list[i%list.length],ring,ang));
    }
  };
  mk(1,pool1,ri(R,3,4)); mk(2,pool2,ri(R,4,5)); mk(3,pool3,ri(R,3,4)); mk(4,pool4,2);
  // 足りない属性は差し替えて必ず用意する
  const hasAttr=a=>locs.some(l=>KIND[l.kind].attr.includes(a));
  const forceIn=(ring,kind)=>{ const l=pick(R,ringOf[ring]); l.kind=kind; l.len=KIND[kind].len;
    l.name=dirName(l.ang)+'の'+KIND[kind].n; };
  if(!ringOf[1].some(l=>KIND[l.kind].attr.includes('water'))) forceIn(1,pick(R,['spring','fall','marsh']));
  if(!locs.some(l=>KIND[l.kind].attr.includes('view')&&l.ring<=3)) forceIn(2,'cliff');
  if(!hasAttr('shelter')) forceIn(2,'cave');
  if(!locs.some(l=>l.kind==='ruins')) { const l=pick(R,ringOf[4]); l.kind='ruins'; l.len=KIND.ruins.len; l.name=dirName(l.ang)+'の石柱の丘' }

  // つなぐ：内側の輪へ1〜2本、同じ輪の隣へときどき
  const link=(a,b)=>{ if(a===b||a.adj.includes(b.id))return;
    a.adj.push(b.id); b.adj.push(a.id); };
  for(let r=1;r<=4;r++){
    ringOf[r].forEach(l=>{
      const inner = r===1?[locs[0]]:ringOf[r-1];
      const sorted=inner.slice().sort((p,q)=>angDiff(p.ang,l.ang)-angDiff(q.ang,l.ang));
      link(l,sorted[0]);
      if(sorted[1]&&R()<.4) link(l,sorted[1]);
    });
    for(let i=0;i<ringOf[r].length;i++){
      const a=ringOf[r][i], b=ringOf[r][(i+1)%ringOf[r].length];
      if(ringOf[r].length>2 && R()<.45) link(a,b);
    }
  }
  // 孤立を防ぐ
  locs.forEach(l=>{ if(!l.adj.length&&l.id) link(l,locs[Math.max(0,l.id-1)]) });
  return {locs};
}
function angDiff(a,b){ let d=Math.abs(a-b)%6.283; return d>3.1416?6.283-d:d }

/* 地点間の所要時間（分）。輪をまたぐほど遠い */
function edgeTime(a,b){
  const A=S.world.locs[a], B=S.world.locs[b];
  const base=34+Math.max(A.ring,B.ring)*13+angDiff(A.ang,B.ang)*14;
  return Math.round(base*(1+((A.id*7+B.id*13)%9)/40));
}
/* 最短経路（ダイクストラ） */
function route(from,to){
  const L=S.world.locs, dist={}, prev={}, seen={};
  L.forEach(l=>dist[l.id]=1e9); dist[from]=0;
  for(;;){
    let u=-1,best=1e9;
    L.forEach(l=>{ if(!seen[l.id]&&dist[l.id]<best){best=dist[l.id];u=l.id} });
    if(u<0||u===to) break;
    seen[u]=1;
    L[u].adj.forEach(v=>{
      const d=dist[u]+edgeTime(u,v);
      if(d<dist[v]){ dist[v]=d; prev[v]=u }
    });
  }
  if(dist[to]>=1e9) return null;
  const path=[to]; let c=to;
  while(c!==from){ c=prev[c]; if(c===undefined) return null; path.unshift(c) }
  return {path, time:dist[to]};
}
const here=()=>S.world.locs[S.at];
const campLoc=()=>S.world.locs[S.camp];
const hasAt=(l,a)=>KIND[l.kind].attr.includes(a);
const atCamp=()=>S.at===S.camp;

/* ───────── 持ち物と重さ ───────── */
const wOf=id=>ITEM[id]?ITEM[id].w:1;
function load(){ let w=0; for(const k in S.inv) w+=wOf(k)*S.inv[k]; return w }
function capacity(){ return CAP0 + (has('basket')?6:0) + (has('frame')?10:0) }
function room(){ return capacity()-load() }
/* 持てるぶんだけ受け取る。入りきらなければその旨を返す */
function addItem(id,n){
  n=n||1;
  const w=wOf(id), can=Math.max(0,Math.floor(room()/w));
  const got=Math.min(n,can);
  if(got>0) S.inv[id]=(S.inv[id]||0)+got;
  if(got<n) S.overflow=(S.overflow||0)+(n-got);
  return got;
}
function delItem(id,n){ n=n||1; if(!S.inv[id])return 0; S.inv[id]-=n; if(S.inv[id]<=0)delete S.inv[id]; return n }
function has(id,n){ return (S.inv[id]||0) >= (n||1) }
function itemName(id){ if(ITEM[id])return ITEM[id].n; const u=UNK.find(u=>u.id===id); return u?u.n:id }
function itemIcon(id){ if(ITEM[id])return ITEM[id].i; const u=UNK.find(u=>u.id===id); return u?u.i:'▫' }
function isUnk(id){ return !!UNK.find(u=>u.id===id) }
/* 置き場（拠点）。重さの制限はないが、嵐と獣に荒らされる */
function toStore(id,n){ n=Math.min(n||1,S.inv[id]||0); if(!n)return 0; delItem(id,n); S.store[id]=(S.store[id]||0)+n; return n }
function fromStore(id,n){
  n=Math.min(n||1,S.store[id]||0); if(!n)return 0;
  const got=addItem(id,n); S.store[id]-=got; if(S.store[id]<=0)delete S.store[id];
  if(got<n) lg('これ以上は持てない。','bad');
  return got;
}
function payFrom(c){                       // 作る／建てるは手持ち＋置き場から払う
  for(const k in c){
    let need=c[k];
    const fromInv=Math.min(need,S.inv[k]||0); delItem(k,fromInv); need-=fromInv;
    if(need>0){ S.store[k]-=need; if(S.store[k]<=0) delete S.store[k] }
  }
}
function stockOf(k){ return (S.inv[k]||0)+(atCamp()?(S.store[k]||0):0) }
function canPay(c){ for(const k in c) if(stockOf(k)<c[k]) return false; return true }
function costStr(c){ return Object.keys(c).map(k=>itemName(k)+'×'+c[k]).join('　') }

/* ───────── 熟練 ───────── */
function gain(sk,n){
  S.xp[sk]=(S.xp[sk]||0)+(n||1);
  const lv=S.skills[sk];
  if(lv<4 && S.xp[sk]>=SKNEED[lv+1]){
    S.skills[sk]=lv+1; toast('熟練 ― '+SKILL[sk]+' が上がった');
    lg('手が、覚えはじめている。（'+SKILL[sk]+'）','good');
  }
}
const sk=k=>S.skills[k];

/* ───────── 記録 ───────── */
function lg(t,k){ S.log.push({t,k:k||''}); if(S.log.length>60)S.log.shift(); drawLog() }
function diary(t){ S.diary.push({d:S.day,t}) }
function toast(t){
  const e=document.getElementById('uiToast');
  e.textContent=t; e.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>e.classList.remove('on'),2100);
}

/* ───────── 時刻・天候 ───────── */
const hourOf=()=>S.min/60;
const isNight=()=>{const h=hourOf(); return h>=DUSK||h<DAWN};
function clockStr(){ const h=Math.floor(S.min/60)%24, m=Math.floor(S.min%60/10)*10; return h+':'+String(m).padStart(2,'0') }
const WX={clear:{n:'晴',c:0},cloud:{n:'曇',c:2},rain:{n:'雨',c:4},storm:{n:'嵐',c:11},fog:{n:'霧',c:4}};
function rollWeather(){
  const r=mulberry32(S.seed*7919+S.day);
  const t=[['clear',.34],['cloud',.26],['rain',.2],['fog',.08],['storm',.12]];
  let v=r(),acc=0,w='clear';
  for(const[k,p]of t){acc+=p; if(v<acc){w=k;break}}
  if(S.day>=MAX_DAY-1) w='storm';
  if(S.day<=2) w='clear'; else if(S.day<=4&&w==='storm') w='cloud';
  S.weather=w;
}

/* ───────── 一日のはじまり ───────── */
function dailyReset(first){
  rollWeather();
  S.world.locs.forEach(l=>{
    l.rich=Math.min(100,l.rich+6+ (l.ring<2?2:0));
    l.spots.forEach(sp=>{ if(sp.left<sp.max && chance(.55)) sp.left++ });
  });
  // 漂着物は「浜のある地点」にだけ流れ着く
  S.drift=[];
  const c=campLoc();
  if(hasAt(c,'shore')){
    const n=(S.stormed?ri(Q,2,4):0)+ri(Q,1,3);
    for(let i=0;i<n;i++) S.drift.push({x:Math.round(140+Q()*(c.len-260)), got:0, k:Math.floor(Q()*3)});
  }
  if(S.weather==='rain'||S.weather==='storm'){
    S.water=clamp(S.water+16,0,100);
    if(stockOf('pot')&&(S.store.water||0)<3){ S.store.water=(S.store.water||0)+1; }
    if(!first) lg('雨。葉を広げて受けた水を飲む。','good');
  }
  if(!first){
    S.stormed = S.weather==='storm'?1:0;
    if(S.weather==='storm') stormDamage();
  }
}
function stormDamage(){
  lg('夜通し、島じゅうが鳴っていた。','bad');
  diary('嵐。波が野営地の上まで駆け上がってきた。');
  if(S.built.raft>0 && chance(.42-sk('sail')*.07)){ S.built.raft--; lg('いかだが波にさらわれ、組んだところが崩れている。','bad') }
  else if(S.built.hut>1 && chance(.3)){ S.built.hut--; lg('屋根が飛んだ。','bad') }
  if(S.built.tower>2){ S.built.tower=2; lg('狼煙の火は、とうに消えている。','bad') }
  // 置き場も無事では済まない
  const ks=Object.keys(S.store);
  if(ks.length&&chance(.5)){
    const k=pick(Q,ks), n=Math.max(1,Math.floor(S.store[k]*(.3+Q()*.4)));
    S.store[k]-=n; if(S.store[k]<=0)delete S.store[k];
    lg('置き場の'+itemName(k)+'が流されていた。','bad');
  }
}

/* ───────── 時間を進める ───────── */
function advance(m,noWrap){
  if(S.over) return;
  for(let i=0;i<m;i++){
    S.min++;
    const h=S.min/60, night=(h>=DUSK||h<DAWN), per=1/60;
    const L=here(), shelter=atCamp()?S.built.hut:0;
    S.food -= 1.18*per;
    S.water-= 1.62*per*(S.weather==='storm'?1.15:1);
    if((S.weather==='rain'||S.weather==='storm') && !hasAt(L,'shelter') && shelter<2) S.wet=1;
    if(fireHere()&&S.wet&&Q()<per*2) S.wet=0;
    if(S.wet&&!night&&(S.weather==='clear'||S.weather==='cloud')&&Q()<per*0.6) S.wet=0;   // 陽に乾く
    let cold=(night?4:-6)+WX[S.weather].c+(S.wet?4:0)
            -(fireHere()?22:0)-shelter*4.5-(hasAt(L,'shelter')?5:0);
    S.warm=clamp(S.warm-cold*per*1.1,0,100);
    let san=0.12+(night&&!fireHere()?0.3:0)+(hasAt(L,'dark')&&!S.lit?1.0:0)
           +(S.weather==='storm'?0.35:0)+(S.food<15||S.water<15?0.5:0);
    if(fireHere()) san-=0.5;
    if(atCamp()) san-=0.12;
    S.san-=san*per*2.4;
    if(S.food<=0){ S.food=0; S.hp-=7*per }
    if(S.water<=0){S.water=0; S.hp-=11*per }
    if(S.warm<=0){ S.warm=0; S.hp-=4*per }
    if(S.sick) S.hp-=1.5*per;
    else if(S.food>45&&S.water>45) S.hp+=0.9*per;      // 食えて飲めていれば、傷は塞がる
    S.food=clamp(S.food,0,100); S.water=clamp(S.water,0,100);
    S.san=clamp(S.san,0,100); S.hp=clamp(S.hp,0,100);
    if(S.lit>0 && !has('lamp')) S.lit-=1;
    if(S.hp<=0){ death(); return }
    if(S.san<=0){ ending('madness'); return }
    if(!noWrap && S.min>=24*60){ collapse(); return }
  }
  warnVitals(); hintProgress();
}
const fireHere=()=>atCamp()&&S.fire>0;
function warnVitals(){
  const f=S.flags, w=(k,v,lo,hi,t)=>{ if(v<lo&&!f[k]){f[k]=1;lg(t,'bad')} else if(v>hi) f[k]=0 };
  w('w1',S.water,32,55,'喉が張りついている。水を探さないと。');
  w('w2',S.water,13,40,'唾も出ない。頭の芯が痛む。');
  w('f1',S.food,30,55,'腹が鳴りやまない。');
  w('f2',S.food,12,40,'力が入らない。何か腹に入れないと。');

/* ───────── 進捗の“におわせ”（数値は出さない） ───────── */
function escapeScore(){
  let v=S.built.raft*22+S.built.tower*15;
  if(stockOf('chart'))v+=8; if(has('radio'))v+=18;
  v+=Math.min(12,stockOf('dried')*2)+Math.min(6,stockOf('water')*2);
  return clamp(v,0,100);
}
function settleScore(){
  let v=S.built.hut*22;
  if(S.built.hut>=3) v+=12;
  v+=Math.min(10,stockOf('dried')*1.5)+(stockOf('pot')?6:0)+(stockOf('still')?8:0)+S.helped*6;
  v+=Math.min(10,S.world.locs.filter(l=>l.visited).length*1.2);
  return clamp(v,0,100);
}
function hintProgress(){
  const e=escapeScore(), s=settleScore(), f=S.flags;
  if(e>=50&&!f.e50){f.e50=1; lg('浜のいかだを眺める。……そろそろ、海に出られる気がする。','good'); diary('いかだが形になってきた。海が、すこし近く見える。')}
  if(e>=80&&!f.e80){f.e80=1; lg('風の向きを読む癖がついた。あとは、決めるだけだ。','good')}
  if(s>=50&&!f.s50){f.s50=1; lg('火のそばに座ると、不思議と落ち着く。ここで暮らしていける気がする。','good'); diary('小屋の中で雨音を聞いた。悪くない、と思ってしまった。')}
  if(s>=80&&!f.s80){f.s80=1; lg('明日も明後日も、この島でやることがある。','good')}
  if((e>=50||s>=50)&&!f.choice){f.choice=1; toast('選べるようになった ― 決断は ≡ から')}
}

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const off=document.createElement('canvas'), octx=off.getContext('2d');
let CW=800,CH=450,SC=1,VW=800,VH=265,cam=0,T=0;

function resize(){
  const d=Math.min(devicePixelRatio||1,2);
  const r=cv.getBoundingClientRect();
  CW=Math.max(1,r.width); CH=Math.max(1,r.height);
  cv.width=Math.round(CW*d); cv.height=Math.round(CH*d);
  off.width=cv.width; off.height=cv.height;
  SC = CH>CW ? Math.max(CH/272, CW/440) : Math.max(1.15, Math.min(CH/258, CW/430));
  VW=CW/SC; VH=CH/SC;
  ctx.setTransform(d,0,0,d,0,0); octx.setTransform(d*SC,0,0,d*SC,0,0);
}
addEventListener('resize',resize);

/* 地点ごとの地形。浜なら左が海、洞窟なら天井がある */
const seaSide=()=>hasAt(here(),'shore');
const darkHere=()=>hasAt(here(),'dark');
const SEA=150;
function groundY(x){
  const L=here(), y=VH*(darkHere()?0.78:GY);
  let v=y+Math.sin(x*0.005+L.sd)*4+Math.sin(x*0.013)*2.5;
  if(seaSide()&&x<SEA) v+=(SEA-x)*0.16;
  if(L.kind==='cliff'||L.kind==='cape') v-=Math.min(70,Math.max(0,(x-L.len*.45))*0.09);
  return v;
}
const worldLen=()=>here().len;
/* ───────── 空の色（時刻で連続に変わる） ───────── */
const PAL={
  night:['#04060f','#0a1024','#141d3c','#1d2947'],
  dawn :['#1d3357','#5d6b8e','#dc9c70','#f4cd97'],
  day  :['#2f74ad','#61a8d2','#abd8e9','#dcf0f5'],
  dusk :['#141c3e','#4b3169','#c8553e','#f2a75e']
};
const TN={ night:[48,66,120,.76], dawn:[255,214,178,.26], day:[255,250,240,.05], dusk:[255,148,96,.32] };
const SPAL={
  night:['#091629','#0b1836','#16264a'], dawn:['#3b4a76','#6f6b90','#b58e88'],
  day  :['#286a90','#3f8dab','#6fbccb'], dusk:['#2b3762','#69506e','#bb7159']};
const KEY=[[0,'night'],[4.4,'night'],[6.2,'dawn'],[8.6,'day'],[16,'day'],[18.4,'dusk'],[20.4,'night'],[24,'night']];
const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
function mixc(a,b,k){const A=hx(a),B=hx(b);return`rgb(${Math.round(A[0]+(B[0]-A[0])*k)},${Math.round(A[1]+(B[1]-A[1])*k)},${Math.round(A[2]+(B[2]-A[2])*k)})`}
function skyNow(){
  const h=hourOf()%24; let i=0;
  while(i<KEY.length-2 && h>=KEY[i+1][0]) i++;
  const a=KEY[i], b=KEY[i+1], k=clamp((h-a[0])/(b[0]-a[0]||1),0,1);
  const pa=PAL[a[1]], pb=PAL[b[1]], ta=TN[a[1]], tb=TN[b[1]];
  const cs=pa.map((c,j)=>mixc(c,pb[j],k));
  const sc=SPAL[a[1]].map((c,j)=>mixc(c,SPAL[b[1]][j],k));
  const tt=ta.map((v,j)=>v+(tb[j]-v)*k);
  let dark = a[1]==='night'&&b[1]==='night'?1 : (a[1]==='night'?1-k : b[1]==='night'?k : 0);
  // 天候で暗くする
  const wx=WX[S.weather].c/16;
  return {cs, sea:sc, tint:`rgba(${tt[0]|0},${tt[1]|0},${tt[2]|0},${(tt[3]+wx*.18).toFixed(3)})`, dark, wx};
}
function glow(c,x,y,r,col){
  if(r<=0)return;
  const g=c.createRadialGradient(x,y,1,x,y,r);
  g.addColorStop(0,col); g.addColorStop(1,col.replace(/[\d.]+\)$/,'0)'));
  c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,7); c.fill();
}

function sky(c,sk){
  const g=c.createLinearGradient(0,0,0,VH*GY+8);
  sk.cs.forEach((col,i)=>g.addColorStop(i/3,col));
  c.fillStyle=g; c.fillRect(0,0,VW,VH);
  const h=hourOf();
  if(sk.dark>.35){
    const sr=mulberry32(7);
    for(let i=0;i<110;i++){
      const x=sr()*VW,y=sr()*VH*.6, a=(.15+sr()*.6)*sk.dark*(.6+.4*Math.sin(T*.002+i));
      c.fillStyle=`rgba(255,255,255,${a})`; c.fillRect(x,y,1,1);
    }
    const mp=((h+24-19)%24)/12, mx=VW*(.08+mp*.86), my=VH*(GY-Math.sin(mp*Math.PI)*.52);
    glow(c,mx,my,30,`rgba(200,215,255,${.18*sk.dark})`);
    c.fillStyle=`rgba(233,236,244,${sk.dark})`; c.beginPath(); c.arc(mx,my,11,0,7); c.fill();
  }
  if(h>DAWN-.6&&h<DUSK+.6){
    const p=clamp((h-DAWN)/(DUSK-DAWN),0,1);
    const sx=VW*(.06+p*.88), sy=VH*(GY-Math.sin(p*Math.PI)*.56);
    const warm = p<.18||p>.82;
    glow(c,sx,sy,58,warm?'rgba(255,160,80,.30)':'rgba(255,250,200,.20)');
    c.fillStyle=warm?'#ffb15e':'#fff8e0';
    c.beginPath(); c.arc(sx,sy,warm?13:9,0,7); c.fill();
  }
  // 雲
  const cr=mulberry32(3), cl=S.weather;
  const cn = cl==='clear'?4 : cl==='fog'?3 : 7;
  c.fillStyle = cl==='storm'?'rgba(40,42,55,.62)' : cl==='rain'?'rgba(90,96,112,.45)'
              : sk.dark>.5?'rgba(90,100,130,.20)'
              : sk.cs[2].replace('rgb(','rgba(').replace(')',',.34)');
  for(let i=0;i<cn;i++){
    const bx=cr()*VW*1.7, y=VH*(.05+cr()*.26), s2=.5+cr()*.9;
    const x=((bx-(cam*.12)-T*.03)%(VW*1.7)+VW*1.7)%(VW*1.7)-VW*.35;
    c.beginPath();
    for(let j=0;j<5;j++){
      const ex=x+j*15*s2, ey=y+Math.sin(j*1.6)*3, rx=15*s2, ry=(5.5-Math.abs(j-2)*.8)*s2;
      c.moveTo(ex+rx,ey); c.ellipse(ex,ey,rx,ry,0,0,7);
    }
    c.fill();
  }
}
function sea(c,sk){
  const hz=VH*GY-1;
  const g=c.createLinearGradient(0,hz-48,0,hz+18), d=sk.dark;
  g.addColorStop(0,sk.sea[0]); g.addColorStop(.5,sk.sea[1]); g.addColorStop(1,sk.sea[2]);
  c.fillStyle=g; c.fillRect(0,hz-48,VW,68);
  c.fillStyle=`rgba(${d>.5?'8,14,32':'56,68,98'},${d>.5?.9:.34})`;
  const ix=-cam*.08+VW*.62;
  c.beginPath(); c.moveTo(ix-70,hz-3); c.quadraticCurveTo(ix-24,hz-27,ix+20,hz-3); c.fill();
  const h=hourOf();
  if(h>DAWN&&h<DUSK){
    const p=clamp((h-DAWN)/(DUSK-DAWN),0,1), sx0=VW*(.06+p*.88);
    c.fillStyle=(p<.2||p>.8)?'rgba(255,180,110,.20)':'rgba(255,250,210,.14)';
    for(let i=0;i<22;i++){
      const y=hz-45+i*2.3, w2=(5+i*2.1)*(.45+((i*37)%19)/19*.75), ox=Math.sin(T*.004+i*1.7)*4;
      c.fillRect(sx0-w2/2+ox,y,w2,1.5);
    }
  }
  const rough=S.weather==='storm'?3:1;
  for(let i=0;i<70;i++){
    const x=((i*61-cam*.25)%VW+VW)%VW, dd=(i*37)%46, y=hz-45+dd;
    const a=(.05+.12*Math.abs(Math.sin(T*.003*rough+i)))*(1-d*.5)*(.4+dd/46);
    c.fillStyle=`rgba(255,255,255,${a})`; c.fillRect(x,y,4+((i*11)%10)*(.5+dd/46),.9);
  }
}
function treeline(c,sk){
  c.fillStyle=mixc('#2f4a37','#070b17',sk.dark);
  const L=here(), lush=({jungle:1,grove:.8,thicket:.7,bamboo:.8,trail:.9,marsh:.5,fall:.7,
                        spring:.5,ruinhut:.4,ruins:.3,cave:.3,rocky:.2,tidepool:.15,
                        shore:.35,dune:.2,cape:.25,cliff:.2,wreck:.2})[L.kind]||.4;
  c.beginPath(); c.moveTo(-4,VH);
  for(let sx=-4;sx<=VW+8;sx+=6){
    const real=sx+cam, wx=sx+cam*.62+L.sd*30, base=VH*GY+9;
    const edge=Math.min(1,Math.max(0,(real-(seaSide()?SEA+60:0))/220));
    c.lineTo(sx, base-(16+Math.abs(Math.sin(wx*0.0043))*34+Math.sin(wx*0.017)*5)*lush*edge);
  }
  c.lineTo(VW+8,VH); c.closePath(); c.fill();
}
const SOIL={

  rocky :['#8b8d93','#6a6c74','#34363d'], tidepool:['#7f8a8c','#5c6668','#2a3133'],
  cape  :['#a89878','#7d7160','#3d3830'], jungle:['#6d7a46','#4b5c33','#2a3320'],
  grove :['#a8a06a','#7d7a4c','#43412c'], thicket:['#5f7040','#3f5230','#212c1c'],

/* 砂の汀を描く地点 */
const SANDY={shore:1,dune:1,cape:1,tidepool:1};
function ground(c,sk){
  const kind=here().kind;
  c.save();
  c.beginPath(); c.moveTo(-10,VH+10);
  for(let sx=-10;sx<=VW+10;sx+=3) c.lineTo(sx,groundY(sx+cam));
  c.lineTo(VW+10,VH+10); c.closePath(); c.clip();
  for(let sx=-12;sx<=VW+12;sx+=4){

  dg.addColorStop(0,'rgba(255,250,235,.10)'); dg.addColorStop(.34,'rgba(0,0,0,0)');

  c.fillStyle=dg; c.fillRect(-10,0,VW+20,VH+10);
  c.restore();

  c.lineCap='butt';
  for(let sx=-10;sx<=VW+10;sx+=4){
    const wx=sx+cam, y1=groundY(wx), y2=groundY(wx+4), b=kind;
    const seg=(o,w,col)=>{c.strokeStyle=col; c.lineWidth=w; c.beginPath(); c.moveTo(sx,y1+o); c.lineTo(sx+4,y2+o); c.stroke()};
    if(SANDY[b]){

    }else{
      const top={jungle:'#4f7c46',rock:'#7e8087',cliff:'#6b6358',cave:'#6a6472',thicket:'#4c6b39',
                 ravine:'#8b8375',tidepool:'#6f8f92',wreck:'#93866d',fissure:'#7b7383'}[b]||'#7e8087';
      seg(2.5,5,mixc(top,'#1b2130',sk.dark));
    }
  }
  decoOf(here()).sh.forEach(o=>{
    const sx=o.x-cam; if(sx<-6||sx>VW+6) return;

  });
}
function shore(c,sk){

  for(let i=0;i<10;i++){

/* ───────── 草木 ───────── */
function palm(c,x,y,h,w,s,sk){
  const wind=(S.weather==='storm'?4:S.weather==='rain'?1.5:1);
  c.strokeStyle=mixc('#453724','#0d1220',sk.dark); c.lineWidth=3.2; c.lineCap='round';
  c.beginPath(); c.moveTo(x,y); c.quadraticCurveTo(x+w*.16,y-h*.6,x+w*.4,y-h); c.stroke();
  const tx=x+w*.4, ty=y-h;
  c.fillStyle=mixc('#2f5c34','#101728',sk.dark);
  for(let i=0;i<6;i++){
    const a=Math.PI+(i/5)*Math.PI+Math.sin(T*.0016*wind+s*9)*.06*wind;
    c.beginPath(); c.moveTo(tx,ty);
    c.quadraticCurveTo(tx+Math.cos(a)*w*.7,ty+Math.sin(a)*w*.5-7,tx+Math.cos(a)*w*1.2,ty+Math.sin(a)*w*.9+6);

/* 地点の草木（地点ごとに固定の見え方） */
function decoOf(L){
  if(L._deco) return L._deco;
  const r=mulberry32((S.seed^(L.id*7919))>>>0), d=[];
  const k=L.kind, n=({jungle:22,grove:16,thicket:18,bamboo:20,marsh:10,trail:14}[k]||8);
  for(let i=0;i<n;i++){
    const x=r()*L.len;
    if(k==='jungle'||k==='trail') d.push({t:'tree',x,h:50+r()*46,w:24+r()*18,k:r()<.3?'palm':'broad',s:r()});
    else if(k==='grove'||k==='shore'||k==='cape'||k==='dune') d.push({t:'tree',x,h:58+r()*34,w:24,k:'palm',s:r()});
    else if(k==='thicket'||k==='marsh') d.push({t:'tree',x,h:28+r()*22,w:20+r()*10,k:'broad',s:r()});
    else if(k==='bamboo') d.push({t:'bam',x,h:52+r()*40,s:r()});
    else d.push({t:'rock',x,r:6+r()*16});
  }
  const g=[]; for(let i=0;i<160;i++) g.push({x:r()*L.len,s:r()});
  const sh=[]; for(let i=0;i<120;i++) sh.push({x:r()*L.len,d:r(),s:r()});
  return L._deco={d,g,sh};
}
function bambooArt(c,x,y,h,s,sk){
  c.strokeStyle=mixc('#6f9247','#16211a',sk.dark); c.lineWidth=3.4; c.lineCap='round';
  const sway=Math.sin(T*.002+s*9)*(S.weather==='storm'?5:1.6);
  c.beginPath(); c.moveTo(x,y); c.quadraticCurveTo(x+sway*.4,y-h*.6,x+sway,y-h); c.stroke();
  c.fillStyle=mixc('#4f7c46','#132018',sk.dark);
  for(let i=1;i<4;i++){
    const yy=y-h*(i/4), xx=x+sway*(i/4);
    c.beginPath(); c.ellipse(xx+7,yy,8,2.4,-.5,0,7); c.ellipse(xx-7,yy-4,8,2.4,.5,0,7); c.fill();
  }
}

let mapHit=[];
function drawMap(c){
  const w=CW,h=CH, cx=w*.5, cy=h*.5,
        rx=Math.min(w*.44,h*.62), ry=Math.max(rx*.8, Math.min(h*.31, rx*1.25));
  const g=c.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#0d1826'); g.addColorStop(1,'#070d16');
  c.fillStyle=g; c.fillRect(0,0,w,h);
  // 海の等深線
  c.strokeStyle='rgba(120,170,200,.10)'; c.lineWidth=1.1;
  for(let i=1;i<=3;i++){ c.beginPath(); c.ellipse(cx,cy,rx*(1+i*.12),ry*(1+i*.12),0,0,7); c.stroke() }
  // 島の輪郭（シードで決まる）
  const r2=mulberry32(S.seed^0x1234);
  c.beginPath();
  for(let a=0;a<6.29;a+=.16){
    const n=1+Math.sin(a*3+S.seed%7)*.09+Math.sin(a*5+2)*.05;
    const px=cx+Math.cos(a)*rx*n, py=cy+Math.sin(a)*ry*n;
    a?c.lineTo(px,py):c.moveTo(px,py);
  }
  c.closePath();
  const ig=c.createLinearGradient(0,cy-ry,0,cy+ry);
  ig.addColorStop(0,'#39402f'); ig.addColorStop(1,'#22261d');
  c.fillStyle=ig; c.fill();
  c.strokeStyle='rgba(226,201,138,.35)'; c.lineWidth=1.6; c.stroke();

  // 方位
  c.strokeStyle='rgba(226,201,138,.4)'; c.lineWidth=1;
  const nx=w-40, ny=h-52;
  c.beginPath(); c.moveTo(nx,ny+13); c.lineTo(nx,ny-13); c.moveTo(nx-6,ny-6); c.lineTo(nx,ny-13); c.lineTo(nx+6,ny-6); c.stroke();
  c.fillStyle='rgba(226,201,138,.7)'; c.font='600 11px "Hiragino Sans",sans-serif'; c.textAlign='center';
  c.fillText('北',nx,ny-18);
  c.fillStyle='rgba(226,201,138,.5)'; c.font='500 13px "Hiragino Mincho ProN",serif';
  c.textAlign='left'; c.fillText('見 取 図',20,58);

  const P=l=>({x:cx+l.mx*rx*.88, y:cy+l.my*ry*.88});
  // 道
  c.strokeStyle='rgba(226,201,138,.22)'; c.setLineDash([4,4]); c.lineWidth=1.3;
  S.world.locs.forEach(l=>l.adj.forEach(j=>{
    if(j<l.id) return;
    const b=S.world.locs[j];
    if(!(l.seen&&b.seen)) return;
    const p=P(l),q=P(b); c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(q.x,q.y); c.stroke();
  }));
  c.setLineDash([]);
  // 選んだ先への道すじ
  if(S.sel>=0){
    const r3=route(S.at,S.sel);
    if(r3){ c.strokeStyle='rgba(255,225,150,.85)'; c.lineWidth=2.4; c.beginPath();
      r3.path.forEach((id,i)=>{ const p=P(S.world.locs[id]); i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y) }); c.stroke() }
  }
  // 地点
  mapHit=[];
  S.world.locs.forEach(l=>{
    if(!l.seen) return;
    const p=P(l), cur=l.id===S.at, camp=l.id===S.camp, selq=l.id===S.sel;
    mapHit.push({id:l.id,x:p.x,y:p.y,r:19});
    if(selq){ c.fillStyle='rgba(255,225,150,.16)'; c.beginPath(); c.arc(p.x,p.y,21,0,7); c.fill() }
    c.beginPath(); c.arc(p.x,p.y,cur?11:9,0,7);
    c.fillStyle = !l.visited?'#2b3140' : camp?'#e2c98a' : '#c8bfa6';
    c.fill();
    c.strokeStyle = cur?'#fff':'rgba(0,0,0,.5)'; c.lineWidth=cur?2.4:1.4; c.stroke();
    if(!l.visited){ c.setLineDash([3,3]); c.strokeStyle='rgba(226,201,138,.5)';
      c.beginPath(); c.arc(p.x,p.y,14,0,7); c.stroke(); c.setLineDash([]) }
    if(camp){ c.strokeStyle='#e2c98a'; c.lineWidth=1.4; c.beginPath(); c.arc(p.x,p.y,15,0,7); c.stroke();
      c.fillStyle='#e2c98a'; c.font='11px sans-serif'; c.textAlign='center'; c.fillText('⛺',p.x,p.y-18) }
    if(l.visited&&KIND[l.kind].attr.includes('shore')){
      c.strokeStyle='rgba(150,200,220,.6)'; c.lineWidth=1.1; c.beginPath();
      for(let i=0;i<3;i++){ c.moveTo(p.x-8+i*5.5,p.y+13); c.quadraticCurveTo(p.x-5.2+i*5.5,p.y+11,p.x-2.5+i*5.5,p.y+13) }
      c.stroke();
    }
    const up=(l.ring%2===1&&!cur), ty=p.y+(up?-19:(cur?27:23));
    const label=l.visited?l.name:'？';
    c.font='500 '+(w<520?10:11.5)+'px "Hiragino Sans","Noto Sans JP",sans-serif';
    c.textAlign='center';
    const tw=c.measureText(label).width;
    c.fillStyle='rgba(8,12,18,.74)';
    c.fillRect(p.x-tw/2-4,ty-9.5,tw+8,13);
    c.fillStyle=l.visited?'#e6dfd0':'#8d8778';
    c.fillText(label, p.x, ty);
    if(l.visited&&l.rich<35){ c.fillStyle='rgba(200,140,120,.9)';
      c.fillText('荒れている',p.x,ty+(up?-13:13)) }
  });
  c.textAlign='left';
  // 現在地の目印
  const me=P(here());
  c.strokeStyle='rgba(255,255,255,.75)'; c.lineWidth=1.2;
  const rr=16+Math.sin(T*.05)*2.2;
  c.beginPath(); c.arc(me.x,me.y,rr,0,7); c.stroke();
}
function mapClick(x,y){
  let best=null,bd=17;
  mapHit.forEach(h=>{ const d=Math.hypot(h.x-x,h.y-y); if(d<bd){bd=d;best=h} });
  if(!best){ S.sel=-1; mapHint(); return }
  if(best.id===S.at){ S.sel=-1; closeMap(); return }
  if(S.sel===best.id) travelTo(best.id);
  else { S.sel=best.id; mapHint() }
}

function draw(){
  requestAnimationFrame(draw);
  if(!S) return;
  T++;
  const c=octx, sk=skyNow();
  c.clearRect(0,0,VW,VH);

  if(S.view==='map'){
    ctx.clearRect(0,0,CW,CH);
    drawMap(ctx);
    return;
  }

  const L=here(), deco=decoOf(L);
  cam=clamp(S.x-VW*0.42,-30,Math.max(0,worldLen()-VW));

  if(darkHere()){
    const g=c.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,'#07080d'); g.addColorStop(1,'#0d0f16');
    c.fillStyle=g; c.fillRect(0,0,VW,VH);
  }else{
    sky(c,sk);
    if(seaSide()) sea(c,sk);
    treeline(c,sk);
  }
  ground(c,sk);
  if(seaSide()) shore(c,sk);
  ceiling(c,sk);

  deco.d.forEach(o=>{
    const sx=o.x-cam; if(sx<-90||sx>VW+90) return;
    const y=groundY(o.x);
    if(o.t==='tree') (o.k==='palm'?palm:broadleaf)(c,sx,y,o.h,o.w,o.s,sk);
    else if(o.t==='bam') bambooArt(c,sx,y,o.h,o.s,sk);
    else { c.fillStyle=mixc('#71737a','#1a1e28',sk.dark);
      c.beginPath(); c.ellipse(sx,y-o.r*.35,o.r,o.r*.7,0,0,7); c.fill() }
  });

  L.spots.forEach(sp=>{
    const sx=sp.x-cam; if(sx<-60||sx>VW+60) return;
    spotArt(c,sp,sx,groundY(sp.x),sk);
  });
  if(hasAt(L,'water')){
    const wx=Math.round(L.len*.46)-cam, wy=groundY(Math.round(L.len*.46));
    if(wx>-60&&wx<VW+60){
      c.fillStyle=mixc('#6f7c80','#242a33',sk.dark);
      c.beginPath(); c.ellipse(wx,wy-1,22,7,0,0,7); c.fill();
      c.fillStyle=mixc('#5fb0c8','#1d3550',sk.dark);
      c.beginPath(); c.ellipse(wx,wy-3,17,5,0,0,7); c.fill();
      c.fillStyle=`rgba(255,255,255,${.28+.2*Math.sin(T*.02)})`; c.fillRect(wx-11,wy-4,22,.9);
      marker(c,wx,wy,'rgba(150,220,255,A)');
    }
  }
  if(atCamp()){
    S.drift.forEach(d=>{ const sx=d.x-cam; if(sx>-60&&sx<VW+60) driftArt(c,d,sx,groundY(d.x),sk) });
    const cxp=campSpots();
    hutArt(c,cxp.hut-cam,groundY(cxp.hut),S.built.hut,sk);
    fireArt(c,cxp.fire-cam,groundY(cxp.fire),S.fire>0,sk);
    if(hasAt(L,'shore')) raftArt(c,cxp.raft-cam,groundY(cxp.raft),S.built.raft,sk);
    if(hasAt(L,'view'))  towerArt(c,cxp.tower-cam,groundY(cxp.tower),S.built.tower,sk);
    storeArt(c,cxp.store-cam,groundY(cxp.store),sk);
  }
  playerArt(c,S.x-cam,groundY(S.x),sk);

  deco.g.forEach(o=>{
    const sx=o.x-cam*1.3; if(sx<-14||sx>VW+14) return;
    c.strokeStyle=`rgba(${sk.dark>.5?'8,12,20':'28,42,24'},${sk.dark>.5?.92:.5})`;
    c.lineWidth=1.4; c.beginPath(); c.moveTo(sx,VH);
    c.quadraticCurveTo(sx+2.5,VH-9-o.s*8,sx+6+Math.sin(T*.003+o.s*8)*1.8,VH-17-o.s*13); c.stroke();
  });

  if(!darkHere()){
    c.globalCompositeOperation='multiply'; c.fillStyle=sk.tint; c.fillRect(0,0,VW,VH);
    c.globalCompositeOperation='source-over';
    weatherFX(c,sk);
  }
  const dk = darkHere()?1:sk.dark;
  if(dk>.25){
    if(atCamp()&&S.fire>0){
      const fx=campSpots().fire-cam;
      c.globalCompositeOperation='lighter';
      glow(c,fx,groundY(campSpots().fire)-12,150+Math.sin(T*.02)*6,`rgba(255,168,80,${.4*dk})`);
      c.globalCompositeOperation='source-over';
    }
    const r=S.lit>0?VH*.62:VH*(darkHere()?.20:.34);
    const v=c.createRadialGradient(S.x-cam,groundY(S.x)-18,r*.35,S.x-cam,groundY(S.x)-18,r*2.5);
    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,`rgba(2,3,7,${.55+.42*dk})`);
    c.fillStyle=v; c.fillRect(0,0,VW,VH);
  }

  const san=S.san;
  ctx.clearRect(0,0,CW,CH);
  ctx.filter = san>62?'none' : san>32?'saturate(.62) contrast(1.05)':'saturate(.2) contrast(1.18) hue-rotate(-14deg)';
  const wob = san>62?0 : san>32?Math.sin(T*.02)*.8 : Math.sin(T*.03)*2.6;
  ctx.drawImage(off,0,wob,CW,CH);
  ctx.filter='none';
  if(san<62){
    const v=ctx.createRadialGradient(CW/2,CH/2,CH*(san<32?.14:.32),CW/2,CH/2,CH*.98);
    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,san<32?'rgba(14,4,10,.88)':'rgba(0,0,0,.4)');
    ctx.fillStyle=v; ctx.fillRect(0,0,CW,CH);
  }
  if(san<28){
    const hx2=((S.phantom||0)-cam)*SC, hy=groundY(S.phantom||0)*SC;
    if(hx2>-40&&hx2<CW+40){
      ctx.globalAlpha=.3+.2*Math.sin(T*.01); ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(hx2,hy-29*SC,5*SC,6*SC,0,0,7); ctx.fill();
      ctx.fillRect(hx2-4.5*SC,hy-23*SC,9*SC,23*SC); ctx.globalAlpha=1;
    }
  }
}
/* 拠点の設えは地点の広さに合わせて置く */
function campSpots(){
  const L=campLoc(), u=L.len;
  return {raft:Math.round(u*.10), fire:Math.round(u*.36), hut:Math.round(u*.52),
          store:Math.round(u*.64), tower:Math.round(u*.84)};
}
function storeArt(c,x,y,sk){
  const n=Object.keys(S.store).length;
  c.fillStyle=mixc('#6d5433','#282830',sk.dark);
  c.fillRect(x-14,y-11,28,11);
  c.fillStyle=mixc('#8c6d43','#3a3a45',sk.dark); c.fillRect(x-16,y-15,32,5);
  if(n){ c.fillStyle=mixc('#c9a961','#4a4433',sk.dark);

/* =========================================================================
   島をめぐる ― 移動・探索・拠点
   ========================================================================= */
function openMap(){ if(S.over)return; S.view='map'; S.sel=-1;
  document.body.classList.add('mapmode'); requestAnimationFrame(resize); mapHint(); hit('ui') }
function closeMap(){ S.view='scene'; document.body.classList.remove('mapmode');
  $('uiMapHint').style.display='none'; requestAnimationFrame(resize) }
function mapHint(){
  const e=$('uiMapHint'); e.style.display='block';
  if(S.sel<0){
    e.innerHTML='地点を選ぶ　―　もう一度おすと発つ　／　<b>地</b>で戻る<br>'+
      '<span style="opacity:.6">'+here().name+'　'+attrLine(here())+'</span>';
    return;
  }
  const L=S.world.locs[S.sel], r=route(S.at,S.sel);
  const t=r?travelCost(r.time):0;
  e.innerHTML='<b>'+(L.visited?L.name:'見たことのない方角')+'</b>　片道およそ '+
    Math.floor(t/60)+'時間'+(t%60?String(t%60).padStart(2,'0')+'分':'')+
    '　（着くのは '+arriveStr(t)+'ごろ）<br>'+
    (L.visited? '<span style="opacity:.6">'+attrLine(L)+'　'+richWord(L)+'</span>'
              : '<span style="opacity:.6">何があるかは、行ってみるまでわからない</span>')+
    '<br>もう一度おすと発つ';
}
function attrLine(L){
  const a=KIND[L.kind].attr.map(k=>ATTR[k]);
  return a.length?a.join('・'):'とくに何もない';
}
function richWord(L){ return L.rich>72?'手つかず':L.rich>45?'まだ採れる':L.rich>22?'採り尽くしかけ':'荒れている' }
function arriveStr(t){ const m=(S.min+t)%1440, h=Math.floor(m/60); return h+':'+String(Math.floor(m%60/10)*10).padStart(2,'0') }
function travelCost(base){
  let t=base;
  if(load()>capacity()*.8) t*=1.28;
  if(S.warm<25||S.food<14||S.water<14) t*=1.2;
  if(S.weather==='storm') t*=1.3; else if(S.weather==='rain') t*=1.1;
  if(isNight()) t*=1.25;
  return Math.round(t);
}
function travelTo(id){
  const r=route(S.at,id); if(!r) return;
  closeMap();
  const t=travelCost(r.time);
  const hops=r.path.length-1;
  lg('荷を担いで歩きだした。');
  for(let i=0;i<hops&&!S.over;i++){
    advance(Math.round(t/hops));
    if(S.over) return;
    if(chance(.2+(isNight()?.12:0))) travelEvent();
  }
  if(S.over) return;
  const L=S.world.locs[id];
  const first=!L.visited;
  L.visited=1; L.seen=1;
  L.adj.forEach(j=>{ if(!S.world.locs[j].seen){ S.world.locs[j].seen=1 } });
  S.at=id; S.x=Math.round(L.len*.2); S.face=1; S.moved++;
  if(first){
    lg('着いた。'+L.name+'。'+KINDLINE(L),'good');
    diary(L.name+'に出た。'+attrLine(L)+'。');
    gain('gather',2); S.san=clamp(S.san+4,0,100);
  }else lg(L.name+'に着いた。'+richWord(L)+'。');
  hit('enter');
}
function KINDLINE(L){
  return ({
    shore:'波打ち際に、いろいろと打ち上げられている。', dune:'風紋の向こうに海が見下ろせる。',
    rocky:'黒い岩が海へせり出している。', tidepool:'潮が引いて、岩の底が露わになっている。',
    cape:'岬の先。水平線がまるく見える。', jungle:'見上げるほどの木が、光を遮っている。',
    grove:'椰子がまっすぐ並んでいる。', thicket:'棘のある藪。踏み込むと足を取られる。',
    bamboo:'風が鳴っている。竹が擦れる音だ。', marsh:'足首まで沈む。虫の羽音がやまない。',
    fall:'水音。落ちた水が、白く砕けている。', spring:'岩の隙間から、澄んだ水が湧いている。',
    cave:'岩の口が黒く開いている。灯りがないと奥へは行けない。',
    cliff:'切り立っている。下から潮の音がのぼってくる。',
    trail:'獣の通った跡。糞と、折れた枝。', wreck:'船だったものが、腹を見せて横たわっている。',
    ruinhut:'誰かが建てた小屋の骨組みが残っている。', ruins:'石の柱が、いくつも立っている。'
  })[L.kind]||'';
}
/* ───────── 道中の出来事 ───────── */
function travelEvent(){
  const r=Q();
  if(r<.16){ S.hp-=ri(Q,4,10); lg('根に足を取られて転んだ。膝が切れている。','bad') }
  else if(r<.3){ const t=ri(Q,20,50); advance(t); lg('道を見失って、'+t+'分ほど余計に歩いた。','bad') }
  else if(r<.42){ const it=pick(Q,['wood','fiber','stone','shell','leaf']); const g=addItem(it,1);
    lg(g?'道端に'+itemName(it)+'が落ちていた。':'道端に何か落ちていたが、手が塞がっていた。') }
  else if(r<.52&&S.weather!=='clear'){ advance(ri(Q,30,60)); S.warm=clamp(S.warm+8,0,100);
    lg('岩陰で雨をやり過ごした。') }
  else if(r<.62){ const id=S.world.locs.find(l=>!l.seen);
    if(id){ id.seen=1; lg('尾根の上から、まだ行っていない方角が見えた。','good'); toast('地図に方角が増えた') }
    else lg('風が、遠くの波音を運んできた。') }
  else if(r<.74){ S.san-=5; lg('人の声が聞こえた気がして、立ち止まった。誰もいない。') }
  else if(r<.86){ beast() }
  else if(S.day>5&&S.met<3&&chance(.5)){ castaway() }
  else { const it=pick(Q,NUTS); if(addItem(it,1)) lg('道すがら、'+itemName(it)+'をひとつ摘んだ。') }
}
function beast(){
  lg('低い唸り声。茂みが揺れている。','bad');
  choice('獣が、こちらを見ている。',[
    {t:'銛を構える', ok:has('spear'), f:()=>{
      if(chance(.35+sk('hunt')*.11)){ lg('突いた。手が痺れるほどの手応え。','good');
        addItem('meat',2); addItem('bone',1); gain('hunt',3); S.kills++ }
      else { S.hp-=ri(Q,10,20); lg('牙が腕をかすめた。血が出ている。','bad'); gain('hunt',1) }
      advance(30);
    }},
    {t:'火を突きつける', ok:S.lit>0||has('torch'), f:()=>{
      if(!S.lit) useLight();
      lg('炎を突き出すと、獣は闇へ退いた。','good'); S.lit=Math.max(0,S.lit-20); advance(15);
    }},
    {t:'荷を捨てて逃げる', ok:1, f:()=>{
      const ks=Object.keys(S.inv).filter(k=>!ITEM[k]||!ITEM[k].t);
      if(ks.length){ const k=pick(Q,ks); const n=Math.min(S.inv[k],ri(Q,1,3)); delItem(k,n);
        lg(itemName(k)+'を撒いて逃げた。','bad') }
      else lg('捨てるものもない。ただ走った。','bad');
      advance(20); S.san-=6;
    }},
    {t:'そっと退がる', ok:1, f:()=>{
      if(chance(.5+sk('gather')*.06)) lg('息を殺して、離れた。');
      else { S.hp-=ri(Q,6,14); S.san-=6; lg('追われた。転びながら逃げた。','bad') }
      advance(20);
    }}

}
function castaway(){

           {t:'生存者',d:'痩せた男が、こちらに手を伸ばしている。声が出ないらしい。'},

      {t:'持ち物を漁る', ok:1, f:()=>{ S.cruel++; S.san-=12; addItem('cloth',2); addItem('metal',1); advance(30);
        lg('使えるものを剥ぎ取った。手が震えている。','bad') }},
      {t:'見なかったことにする', ok:1, f:()=>{ S.san-=5; advance(10); lg('目を逸らして、その場を離れた。') }}

/* =========================================================================
   探す ― 何が出るかは、やってみるまでわからない
   ========================================================================= */
const RESN={
  wood:'流木',timber:'角材',stone:'石',fiber:'繊維',leaf:'大葉',resin:'樹脂',clay:'粘土',
  metal:'金属片',cloth:'布',bone:'骨',shell:'貝',salt:'塩',coco:'椰子の実',fish:'魚',
  meat:'肉',hide:'毛皮',herb:'薬草',egg:'卵',water:'水',tin:'缶詰',parts:'部品',
  bamboo:'竹',relic:'遺品',fruit:'木の実',mush:'茸',tool:'道具'
};
function searchSpot(sp){
  const L=here(), K=KIND[L.kind];
  if(sp.left<=0){ lg('ここはもう、掘り返したあとだ。'); return }
  if(hasAt(L,'dark')&&!S.lit&&!has('torch')&&!has('lamp')){ lg('暗すぎて手元が見えない。灯りが要る。','bad'); return }
  if(hasAt(L,'dark')&&!S.lit) useLight();

  const t=clamp(58+ri(Q,-14,20)-sk('gather')*3,25,90);
  advance(t); if(S.over) return;
  sp.left--; L.rich=Math.max(0,L.rich-6); S.searches++;
  gain('gather',1);

  // 事故（地点の危なさ）
  if(chance(.05+K.dg*.035)){ mishap(); if(S.over) return }

  // 空振り。荒れた場所ほど出ない
  let miss=.22-sk('gather')*.035+(1-L.rich/100)*.30;
  if(S.weather==='storm') miss+=.12; if(S.weather==='rain') miss+=.05;
  if(has('knife')||has('axe')) miss-=.05;
  if(Q()<clamp(miss,.08,.8)){
    lg(pick(Q,['ひとしきり探したが、めぼしいものはなかった。','手が土に汚れただけだった。',
               '目ぼしいものは、先に何かが持っていったあとだった。','時間ばかりが過ぎた。']));
    return;
  }
  // 何が出るか
  let key=wpick(Q,K.res);
  if(key==='fish'&&!has('rod')&&!has('spear')){
    if(chance(.6)){ lg('魚影は見えたが、素手では届かない。'); return }
  }
  if(key==='meat'&&!has('spear')){
    if(chance(.75)){ lg('獣の気配。追ったが、追いつけるはずもなかった。'); gain('hunt',1); return }
  }
  if(key==='water'){ drinkHere(); return }

  const id = RESOLVE[key] ? RESOLVE[key]() : key;
  const FOODY={shell:1,coco:1,fish:1,egg:1,meat:1,fruit:1,mush:1,herb:1,leaf:1,fiber:1};
  let n=(FOODY[key]?2:1)+(chance(.28+sk('gather')*.06)?1:0);
  if(key==='timber'&&!has('axe')&&!has('machete')){ lg('倒せそうな木はあるが、素手では歯が立たない。'); return }
  const got=addItem(id,n);
  if(got<n) lg('これ以上は持てない。'+itemName(id)+'を置いていく。','bad');
  if(got>0){
    lg(pick(Q,['見つけた。','手に入れた。','拾いあげた。'])+itemName(id)+(got>1?'×'+got:'')+'。');
    if(key==='fish') gain('fish',2); if(key==='meat') gain('hunt',2);
  }
  hit('get');
  if(chance(.07)){
    S.water=clamp(S.water+38,0,100);
    lg('岩のくぼみに、雨水が溜まっていた。掌で掬って飲む。','good'); hit('water');
  }
  // 島は、どこにいても多少は食わせてくれる
  if(chance(.14)){
    const f=pick(Q,['shell','egg',pick(Q,NUTS)]);
    if(addItem(f,1)) lg('ついでに'+itemName(f)+'をひとつ見つけた。');
  }
  // まれに良いもの
  if(chance(.055)){
    const r=Q();
    if(r<.3&&addItem('chart',1)) lg('砂に埋もれた紙。海図の切れ端だ。','good');
    else if(r<.55&&addItem('parts',1)) lg('見慣れぬ機械の部品が出てきた。','good');
    else if(r<.8){ const tl=RESOLVE.tool(); if(addItem(tl,1)) lg('誰かの落とし物らしい。'+itemName(tl)+'。','good') }
    else if(hasAt(L,'lore')) touchRuin();
  }
  // 道の続きが見えることがある
  const unseen=L.adj.map(i=>S.world.locs[i]).filter(l=>!l.seen);
  if(unseen.length&&chance(.3)){ unseen[0].seen=1; toast('地図に方角が増えた');
    lg('木立の切れ間から、道の続きが見えた。','good') }
}
function drinkHere(){
  S.water=100; S.wet=0;
  lg('顔をつけて飲んだ。腹の底まで冷たい。','good');
  if(has('pot')&&(S.inv.water||0)<3){ if(addItem('water',1)) lg('土器にも汲んでおいた。') }
  hit('water');
}
function mishap(){
  const L=here(), r=Q();
  if(r<.28){ S.hp-=ri(Q,5,12); lg('足を滑らせた。したたかに腰を打つ。','bad') }
  else if(r<.5){ S.hp-=ri(Q,3,8); S.sick=Math.max(S.sick,2); lg('虫に刺された。腫れて熱をもっている。','bad') }
  else if(r<.68&&hasAt(L,'dark')){ S.hp-=ri(Q,6,14); lg('頭上で岩が鳴り、欠片が肩を打った。','bad') }
  else if(r<.82){ S.san-=8; lg('足元に骨があった。人のものだ。','bad') }
  else beast();
}
function touchRuin(){
  if(S.ruins>=3) return;
  S.ruins++;
  const LORE=[
    '石に刻まれていた。「三十七人。水は西の窪み。船は来ない」',
    '削られた文字が続く。「六人になった。海へ出た者は帰らない。ここで待て」',
    '最後の一行だけ、深く彫られていた。「島は、待つ者を選ぶ」'
  ];
  const t=LORE[S.ruins-1];
  S.lore.push(t); lg(t,'good'); diary('石柱の文を読んだ。'+t);
  S.san-=8; addItem('relic',1);
  toast('遺構 '+S.ruins+' / 3'); hit('ruin');
}

/* =========================================================================
   その場のもの
   ========================================================================= */
function nearProps(){
  const a=[], L=here();
  L.spots.forEach(sp=>a.push({type:'spot',x:sp.x,o:sp}));
  if(hasAt(L,'water')) a.push({type:'water',x:Math.round(L.len*.46),o:{}});
  if(atCamp()){
    S.drift.forEach(d=>{ if(!d.got) a.push({type:'drift',x:d.x,o:d}) });
    const c=campSpots();
    a.push({type:'camp',x:c.fire,o:{k:'fire'}});
    a.push({type:'camp',x:c.hut,o:{k:'hut'}});
    a.push({type:'camp',x:c.store,o:{k:'store'}});
    if(hasAt(L,'shore')) a.push({type:'camp',x:c.raft,o:{k:'raft'}});
    if(hasAt(L,'view'))  a.push({type:'camp',x:c.tower,o:{k:'tower'}});
  }else if(hasAt(L,'view')) a.push({type:'camp',x:Math.round(L.len*.8),o:{k:'lookout'}});
  return a;
}
function propName(p){
  if(p.type==='spot') return p.o.left>0?'さがす':'（もう掘り返したあとだ）';
  if(p.type==='water') return '水を飲む';
  if(p.type==='drift') return 'あらためる　漂着物';
  const k=p.o.k;
  if(k==='fire') return S.fire>0?'火のそば':'焚き火をおこす';
  if(k==='hut')  return S.built.hut>0?'ねぐら':'寝床をこしらえる';
  if(k==='store')return '置き場';
  if(k==='raft') return S.built.raft>=3?'いかだ（進水できる）':'いかだを組む';
  if(k==='tower')return S.built.tower>=3?'狼煙（上げられる）':'狼煙台を建てる';
  if(k==='lookout') return '見晴らす';
  return '';
}
function nearest(){
  let best=null,bd=46;
  nearProps().forEach(p=>{ const d=Math.abs(p.x-S.x); if(d<bd){bd=d;best=p} });
  return best;
}
function interact(){
  const p=nearest(); if(!p||S.over) return;
  if(p.type==='spot') searchSpot(p.o);
  else if(p.type==='water'){ advance(25); drinkHere(); gain('gather',1) }
  else if(p.type==='drift') openDrift(p.o);
  else campMenu(p.o.k);
}
const DRIFT_T=[
  ()=>{addItem('wood',2); return '流木が二本'}, ()=>{addItem('cloth',1); return '塩の噴いた布'},
  ()=>{addItem('fiber',2); return 'もつれた縄'}, ()=>{addItem('tin',1); return '無傷の缶詰'},
  ()=>{addItem('metal',1); return 'ひしゃげた金属片'}, ()=>{addItem('coco',2); return '椰子の実がふたつ'},

function nextBuild(id){
  const b=BUILD.find(b=>b.id===id&&b.s===S.built[id]+1);
  return b;
}
function buildOpt(b){
  const L=campLoc(), okSk=sk(b.sk)>=b.lv, okAt=!b.need||hasAt(L,b.need);
  return {t:b.n+'を'+(b.id==='tower'&&b.s===3?'つける':'こしらえる'), ok:canPay(b.c)&&okSk&&okAt,
    sub:costStr(b.c)+(okSk?'':'　／　'+SKILL[b.sk]+' Lv'+(b.lv+1)+'が要る')
        +(okAt?'':'　／　'+ATTR[b.need]+'のある場所でないと建てられない'),
    f:()=>{ payFrom(b.c); advance(b.t); S.built[b.id]=b.s; gain(b.sk,4);
      lg(b.n+'ができた。'+b.d+'。','good'); diary(b.n+'をこしらえた。'); hit('build'); hintProgress() }};
}
function campMenu(k){
  const L=here();
  if(k==='lookout'||(k==='tower'&&!atCamp())){
    advance(45); gain('gather',1); S.san=clamp(S.san+6,0,100);
    const un=S.world.locs.filter(l=>!l.seen);
    let n=0; un.forEach(l=>{ if(n<2){ l.seen=1; n++ } });
    S.world.locs.forEach(l=>{ if(l.seen&&!l.visited&&chance(.5)&&!l._peek){ l._peek=1 } });
    lg('高みから島を見渡した。'+(n?'知らない方角が'+n+'つ、地図に増えた。':'もう見落としはなさそうだ。'),'good');
    return;
  }
  if(k==='fire'){
    choice('焚き火',[
      {t:'火をおこす', ok:S.fire<=0&&stockOf('wood')>=1, f:()=>{
        advance(30); payFrom({wood:1});
        if(chance(.55+sk('craft')*.12+(stockOf('resin')?.15:0))){ S.fire=2; lg('火がついた。煙が、まっすぐ立ちのぼる。','good'); gain('craft',2); hit('fire') }
        else lg('湿っている。煙ばかりで、火にならない。','bad');
      }},
      {t:'薪をくべる', ok:S.fire>0&&stockOf('wood')>=1, f:()=>{ payFrom({wood:1}); S.fire=3; advance(15); lg('火が大きくなった。') }},
      {t:'焼く（魚・肉）', ok:S.fire>0&&(stockOf('fish')||stockOf('meat')), f:()=>{
        advance(40); let n=0;
        while(stockOf('fish')&&n<3){ payFrom({fish:1}); addItem('cooked',1); n++ }
        while(stockOf('meat')&&n<3){ payFrom({meat:1}); addItem('cooked',1); n++ }
        gain('craft',1); lg('炙った。脂の匂いが、腹の底を殴ってくる。','good');
      }},
      {t:'火にあたる（1時間）', ok:S.fire>0, f:()=>{ advance(60); S.warm=clamp(S.warm+34,0,100);
        S.san=clamp(S.san+7,0,100); S.wet=0; lg('掌をかざす。震えが止まっていく。','good') }},
      {t:'日誌を書く', ok:1, f:()=>{ advance(30); S.san=clamp(S.san+10,0,100);
        lg('憶えていることを書きつけた。','good'); diary('今日のことを書いた。') }}
    ]);
    return;
  }
  if(k==='store'){ openStore(); return }
  if(k==='hut'){
    const o=[{t:'眠る（朝まで）',ok:1,f:()=>sleep()},
             {t:'横になる（2時間）',ok:1,f:()=>{advance(120); S.hp=clamp(S.hp+6,0,100); lg('目を閉じた。波の音が近い。')}},
             {t:'野営地を移す',ok:1,f:()=>moveCampMenu(),sub:'いまは '+campLoc().name}];
    const b=nextBuild('hut'); if(b) o.unshift(buildOpt(b));
    choice(S.built.hut>0?'ねぐら':'寝床',o); return;
  }
  if(k==='raft'){
    const o=[]; const b=nextBuild('raft'); if(b) o.push(buildOpt(b));
    o.push({t:'いかだで海へ出る',ok:S.built.raft>=1,f:()=>confirmEnd('raft'),
            sub:S.built.raft>=3?'風は掴めそうだ':'まだ、心もとない'});
    choice('いかだ',o); return;
  }
  if(k==='tower'){
    const o=[]; const b=nextBuild('tower'); if(b) o.push(buildOpt(b));
    o.push({t:'狼煙を上げて待つ',ok:S.built.tower>=3,f:()=>confirmEnd('smoke'),
            sub:S.built.tower>=3?'煙は、遠くまで届く':'まず台と火が要る'});
    choice('高み',o); return;
  }
}
/* 置き場：持てないものはここに積む */
function openStore(){
  const inv=Object.keys(S.inv), st=Object.keys(S.store);
  let h='<h2>置き場<span>荷 '+load()+' / '+capacity()+'</span></h2>';
  h+='<p class="memo">持てる量には限りがある。使わないものはここへ。'+
     '<b>嵐や獣に荒らされることがある</b>。</p><h3>手持ち → 置く</h3><div class="grid">';
  if(!inv.length) h+='<p class="memo">何も持っていない。</p>';
  inv.forEach(id=>h+='<button class="cell" data-put="'+id+'"><u>'+itemIcon(id)+'</u><span class="nm">'+
    itemName(id)+'<br><span class="sub">重さ '+wOf(id)+'</span></span><span class="ct">'+S.inv[id]+'</span></button>');
  h+='</div><h3>置き場 → 取る</h3><div class="grid">';

  st.forEach(id=>h+='<button class="cell" data-take="'+id+'"><u>'+itemIcon(id)+'</u><span class="nm">'+

function moveCampMenu(){
  const cand=S.world.locs.filter(l=>l.visited&&l.id!==S.camp);
  let h='<h2>野営地を移す<span>いまは '+campLoc().name+'</span></h2>';
  h+='<p class="memo">建てたものは置いていくことになる（材はいくらか戻る）。'+
     '置き場の荷は運べるが、まる半日かかる。<br>'+
     '<b>浜</b>がなければいかだは組めず、<b>眺望</b>がなければ狼煙は上げられない。</p><div class="grid">';
  cand.forEach(l=>{
    const r=route(S.at,l.id);
    h+='<button class="cell" data-camp="'+l.id+'"><u>⛺</u><span class="nm">'+l.name+
       '<br><span class="sub">'+attrLine(l)+'</span></span></button>';
  });
  if(!cand.length) h+='<p class="memo">ほかに行った場所がない。</p>';
  h+='</div><button class="close" data-x="1">とじる</button>';
  openPanel(h);
}
function moveCamp(id){
  const back={};
  BUILD.forEach(b=>{ if(S.built[b.id]>=b.s) for(const k in b.c) back[k]=(back[k]||0)+Math.floor(b.c[k]/2) });
  S.built={hut:0,raft:0,tower:0}; S.fire=0;
  for(const k in back) S.store[k]=(S.store[k]||0)+back[k];
  const r=route(S.at,id);
  closePanel();
  advance(Math.round((r?travelCost(r.time):60)+240));
  if(S.over) return;
  S.camp=id; S.at=id;
  const L=S.world.locs[id]; L.visited=1; S.x=Math.round(L.len*.3);
  S.flags.e50=S.flags.s50=0;
  lg('野営地を'+L.name+'へ移した。'+(Object.keys(back).length?'解いた材は置き場へ。':''),'good');
  diary('野営地を'+L.name+'に移した。');
  dailyReset(true); hit('build');
}

/* ───────── 眠る ───────── */
function sleep(){
  const shelter=atCamp()?S.built.hut:0, fire=fireHere(), L=here();
  const to=(24-S.min/60)+WAKE;
  advance(Math.max(30,Math.round(to*60)),true);
  if(S.over) return;
  let rec=10+shelter*7+(fire?6:0)+(hasAt(L,'shelter')?5:0)-(S.weather==='storm'?8:0)
         -(S.weather==='rain'&&shelter<2&&!hasAt(L,'shelter')?6:0);
  rec += (S.food>25&&S.water>25)?8:-6;
  S.hp=clamp(S.hp+rec,0,100);
  S.san=clamp(S.san+(shelter?9:4)+(fire?5:0)+(atCamp()?2:0)+(hasAt(L,'shelter')?4:0),0,100);
  if(shelter<1&&!hasAt(L,'shelter')&&chance(.3)){ S.hp-=6; S.san-=8; lg('夜通し、何かが近くを歩いていた。','bad') }
  if(S.weather==='rain'&&shelter<2&&!hasAt(L,'shelter')){ S.wet=1; lg('雨に濡れて眠った。骨まで冷えている。','bad') }
  if(fire||shelter) S.warm=Math.max(S.warm,34+(fire?26:0)+shelter*10);
  if(!atCamp()&&chance(.25)){
    const ks=Object.keys(S.inv).filter(k=>!ITEM[k]||!ITEM[k].t);
    if(ks.length){ const k=pick(Q,ks); delItem(k,1); lg('寝ているあいだに'+itemName(k)+'を持っていかれた。','bad') }
  }
  if(S.fire>0) S.fire--;
  newDay();
}
function collapse(){
  if(S._col) return; S._col=1;
  lg('立っていられない。膝から崩れ落ちた。','bad');
  S.hp-=14; S.san-=10;
  advance(Math.max(1,(24+WAKE)*60-S.min),true);
  S._col=0;
  if(S.over) return;
  S.hp=clamp(S.hp+4,0,100);
  newDay();
}
function newDay(){
  S.min=WAKE*60; S.day++; S.nights++;
  if(S.sick){ S.sick--; if(!S.sick) lg('熱がひいた。','good') }
  if(S.numb) S.numb--;
  if(S.day>MAX_DAY){ ending(pickEnding('storm')); return }
  dailyReset(false);
  lg('── '+S.day+'日目　'+WX[S.weather].n+'　'+here().name+' ──');
  if(S.day===MAX_DAY-2) lg('空の色が、これまでと違う。海が膨らんでいる。','bad');
  if(S.day===MAX_DAY-1) lg('嵐が来る。この島にいられるのは、もう長くない。','bad');
  if(S.day===MAX_DAY)   lg('今日で終わりだ。決めなければ、海が決める。','bad');
  saveRun(); drawHUD(); hit('day');
}

function useItem(id){
  if(isUnk(id)){ eatUnknown(id); return }
  if(EAT[id]){
    delItem(id,1); advance(10); EAT[id](S);
    S.food=clamp(S.food,0,100); S.water=clamp(S.water,0,100); S.san=clamp(S.san,0,100); S.hp=clamp(S.hp,0,100);
    hit('eat'); drawHUD(); if(uiOpen) openPack(); return;
  }
  if(id==='torch'||id==='lamp'){ useLight(); if(uiOpen) openPack(); return }

function useLight(){

}
function eatUnknown(id){
  const eff=S.unk[id], E=EFFECT[eff];

  E.f(S);
  S.food=clamp(S.food,0,100); S.water=clamp(S.water,0,100); S.san=clamp(S.san,0,100); S.hp=clamp(S.hp,0,100);

    S.hint[id]=eff;
    if(!META.effects[eff]){ META.effects[eff]=1; saveMeta(); toast('図鑑に載った ― '+E.n) }

const DEATHS={
  starve:'飢えて死んだ', thirst:'渇いて死んだ', cold:'凍えて死んだ',
  beast:'獣に食われた', poison:'毒にあたって死んだ', fall:'落ちて死んだ', sick:'病んで死んだ', sea:'海に消えた'
};
function confirmEnd(kind){
  const txt={raft:'いかだで海へ出る。戻ることはできない。',
             smoke:'狼煙を上げ、ここで待つ。',
             settle:'脱出を諦め、この島で暮らす。',
             radio:'無線で助けを呼ぶ。'}[kind];
  choice(txt+'　── 本当に？',[
    {t:'決める', ok:1, f:()=>{ ending(pickEnding(kind)) }},
    {t:'やめておく', ok:1, f:()=>{}}
  ]);
}
function pickEnding(kind){
  const e=escapeScore(), s=settleScore(), san=S.san, R2=S.built.raft;
  if(kind==='sanity') return 'madness';
  if(kind==='raft'){
    if(R2>=3&&san>=55&&(stockOf('chart')||sk('sail')>=3)){
      if(has('relic')&&S.ruins>=2) return 'witness';
      return 'homecoming';
    }
    if(R2>=3) return 'picked_up';
    if(R2>=2) return chance(.5)?'drift_again':'picked_up';
    return 'sea_lost';
  }
  if(kind==='smoke'){
    if(S.weather==='storm'||S.weather==='rain') return 'smoke_gone';
    return 'rescue';
  }
  if(kind==='radio') return 'transmission';
  if(kind==='settle'){
    if(S.ruins>=3&&S.buried>0) return 'inheritor';
    if(san<16) return 'become_isle';
    if(san<34) return 'hermit';
    if(S.helped>=2) return 'islanders';
    if(S.built.hut>=3&&san>=68) return 'paradise';
    if(S.diary.length>=18) return 'chronicler';
    return 'quiet_days';
  }
  if(kind==='storm'){
    if(e>=70&&R2>=2) return 'sea_lost';
    if(san<20) return 'madness';
    if(s>=60) return 'quiet_days';
    if(s>=34||e>=34) return 'undecided';
    return chance(.5)?'undecided':'swallowed';
  }
  return 'undecided';
}
function death(cause){
  if(S.over) return;
  S.over=true;
  const c = cause || (S.water<=0?'thirst':S.food<=0?'starve':S.warm<=0?'cold':S.sick?'sick':'beast');
  S._cause=c;
  META.deaths=(META.deaths||0)+1; META.runs=(META.runs||0)+1;
  META.best=Math.max(META.best||0,S.day); saveMeta(); clearRun();
  curtainEnd({n:DEATHS[c],k:'漂流記録',t:S.day+'日目。'+DEATHS[c]+'。\n\n島は、何も変わらずそこにあった。'},true);
}
function ending(id){
  if(S.over) return;

/* =========================================================================
   音（すべてWeb Audioの合成）
   ========================================================================= */
const AU={on:true,ctx:null,n:{}};
function audioInit(){
  if(AU.ctx) return;
  try{ AU.ctx=new (window.AudioContext||window.webkitAudioContext)() }catch(e){ return }
  const c=AU.ctx;
  const buf=c.createBuffer(1,c.sampleRate*2,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const mk=(type,freq,q,g)=>{
    const s=c.createBufferSource(); s.buffer=buf; s.loop=true;
    const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
    const gn=c.createGain(); gn.gain.value=0;
    s.connect(f); f.connect(gn); gn.connect(c.destination); s.start();
    return {gn,f};
  };
  AU.n.wave=mk('lowpass',430,.6,0);
  AU.n.rain=mk('highpass',900,.5,0);
  AU.n.wind=mk('bandpass',260,1.2,0);
  // 波のうねり
  const lfo=c.createOscillator(), lg2=c.createGain();
  lfo.frequency.value=.11; lg2.gain.value=.035;
  lfo.connect(lg2); lg2.connect(AU.n.wave.gn.gain); lfo.start();
  audioUpdate();
}
function audioUpdate(){
  if(!AU.ctx||!S) return;
  const c=AU.ctx, t=c.currentTime, set=(n,v)=>{ if(n) n.gn.gain.setTargetAtTime(AU.on?v:0,t,.6) };
  const near = S.zone?0 : clamp(1-(S.x-SEA)/1400,0,1);
  set(AU.n.wave, S.zone?0.004:0.02+near*0.05);
  set(AU.n.rain, (S.weather==='rain'?0.035:S.weather==='storm'?0.075:0)*(S.zone?.3:1));
  set(AU.n.wind, (S.weather==='storm'?0.05:S.weather==='fog'?0.012:0.008)+(S.zone&&S.zone.dark?0.02:0));
}
function hit(k){
  if(!AU.ctx||!AU.on) return;
  const c=AU.ctx, t=c.currentTime;
  const beep=(f,dur,type,vol)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.08,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02);
  };
  if(k==='get')   { beep(660,.09,'triangle',.05); beep(990,.07,'triangle',.03) }
  if(k==='eat')   { beep(300,.12,'sine',.05) }
  if(k==='water') { beep(880,.14,'sine',.04); beep(1180,.1,'sine',.02) }
  if(k==='fire')  { beep(180,.3,'sawtooth',.03) }
  if(k==='build') { beep(220,.16,'square',.04); setTimeout(()=>beep(330,.2,'square',.035),110) }
  if(k==='enter') { beep(150,.4,'sine',.05) }
  if(k==='ruin')  { beep(520,.9,'sine',.035); beep(780,1.1,'sine',.02) }
  if(k==='day')   { beep(440,.5,'sine',.03); setTimeout(()=>beep(660,.6,'sine',.025),260) }
  if(k==='ui')    { beep(760,.05,'square',.02) }
}

  opts.forEach((o,i)=>{
    h+='<button class="cell" data-c="'+i+'"'+(o.ok?'':' disabled')+'><span class="nm">'+o.t+
       (o.sub?'<br><span class="sub">'+o.sub+'</span>':'')+'</span></button>';

  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.x){ closePanel(); return }
  if(b.dataset.c!==undefined&&CHOICE){
    const o=CHOICE[+b.dataset.c]; if(!o||!o.ok) return;
    closePanel(); CHOICE=null; o.f(); drawHUD(); return;
  }
  if(b.dataset.use){ useItem(b.dataset.use); return }
  if(b.dataset.put){ toStore(b.dataset.put,1); drawHUD(); openStore(); return }
  if(b.dataset.take){ fromStore(b.dataset.take,1); drawHUD(); openStore(); return }

  if(b.dataset.craft){ doCraft(b.dataset.craft); return }

});

function noSelect(el,hard){
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('selectstart',e=>e.preventDefault());
  el.addEventListener('dragstart',e=>e.preventDefault());
  if(hard){
    el.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
    el.addEventListener('touchmove', e=>e.preventDefault(),{passive:false});
  }
}
function bindHold(el){
  let pid=null;
  el.addEventListener('pointerdown',e=>{
    pid=e.pointerId; audioInit();
    try{ el.setPointerCapture(e.pointerId) }catch(_){}
    e.preventDefault();
  });
  const up=()=>{ if(pid===null)return; try{ el.releasePointerCapture(pid) }catch(_){} pid=null };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('lostpointercapture',up);
  noSelect(el,1);
  return ()=>pid!==null;
}
const holdL=bindHold($('bL')), holdR=bindHold($('bR'));

bAct.addEventListener('pointerdown',e=>{ e.preventDefault(); audioInit(); if(!uiOpen&&S.view!=='map') interact() });

let hudT=0, lastT=performance.now();
function step(){
  const now=performance.now(), dt=Math.min(50,now-lastT); lastT=now;
  if(!S||S.over||uiOpen||S.view==='map'){ if(S) S.vx=0; return }
  const slow=(S.warm<25||S.food<12||S.water<12)?.62:1;
  const heavy=load()>capacity()*.8?.78:1;
  const spd=2.5*slow*heavy*(dt/16.7);
  let dx=0;
  if(keys.ArrowRight||keys.d||keys.D||holdR()) dx=spd;
  else if(keys.ArrowLeft||keys.a||keys.A||holdL()) dx=-spd;
  S.vx=dx;
  if(dx){
    S.face=dx>0?1:-1;
    S.x=clamp(S.x+dx,6,worldLen()-14);
    S.walked+=Math.abs(dx);
    S.acc=(S.acc||0)+Math.abs(dx);
    while(S.acc>=26){ S.acc-=26; advance(1); if(!S||S.over) return }   // 地点のなかは歩いても時間はゆるやか
  }
  if(S.phantom===undefined||T%420===0) S.phantom=clamp(S.x+(chance(.5)?-1:1)*(80+Q()*160),20,worldLen()-20);
  updatePrompt();
  if(++hudT%12===0) drawHUD();
}
setInterval(step,16);
setInterval(()=>{ if(S&&!S.over) audioUpdate() },1500);

function saveRun(){
  if(!S||S.over) return;
  try{
    const o=Object.assign({},S);
    o.world={locs:S.world.locs.map(l=>{ const c=Object.assign({},l); delete c._deco; return c })};
    localStorage.setItem(SAVE_KEY,JSON.stringify(o));
  }catch(e){}
}
function clearRun(){ try{ localStorage.removeItem(SAVE_KEY) }catch(e){} }
function loadRun(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return false;
    const o=JSON.parse(raw);
    if(!o.world||!o.world.locs) return false;
    S=o; S.vx=0; S.view='scene';
    clearRun();
    return true;
  }catch(e){ return false }
}

    '<div class="desc">気がつくと、名も知らぬ島の砂の上にいた。<br>'+
    '四十日後、嵐が来る。それまでに <b>海へ出る</b> か、<b>ここで暮らす</b> かを決めなければならない。<br>'+
    '島も、実の毒も、毎回ちがう。何が採れるかは、探してみるまでわからない。</div>'+
    (has_save?'<button class="btn" data-t="resume">つ づ き か ら</button>':'')+
    '<button class="btn" data-t="new">は じ め る</button>'+
    '<button class="btn sm" data-t="codex">図鑑　結末 '+got+' / '+Object.keys(ENDINGS).length+'</button>'+
    '<button class="btn sm" data-t="help">遊びかた</button>';
  curtain.classList.add('on');
}
curtain.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  audioInit();
  const t=b.dataset.t;
  if(t==='new') startRun();
  if(t==='resume'){ if(loadRun()){ curtain.classList.remove('on'); resize(); drawHUD(); drawLog() } else startRun() }
  if(t==='codex') openCodex();
  if(t==='help') helpScreen();
  if(t==='again') startRun();
  if(t==='title') showTitle();
});
function helpScreen(){
  openPanel('<h2>遊びかた</h2>'+
   '<p class="memo"><b>地図（地／M）</b>　島は地点のつながりでできている。地点を選び、もう一度おすと発つ。'+
   '遠いほど時間がかかり、道中では何かが起きる。行ったことのない方角は「？」のまま。</p>'+
   '<p class="memo"><b>さがす（E／✋）</b>　地点のなかを歩き、光る印のところで探す。'+
   '<b>何が出るかは毎回ちがい、空振りもある</b>。探すほどその場所は荒れて、出にくくなる（日が経てば少し戻る）。</p>'+
   '<p class="memo"><b>荷</b>　持てる重さに限りがある。持ちきれないものは置いてくることになる。'+
   '野営地の<b>置き場</b>に積めるが、嵐や獣に荒らされることがある。籠と背負子で増やせる。</p>'+
   '<p class="memo"><b>野営地</b>　最初は漂着した浜。<b>どこへでも移せる</b>。'+
   'いかだは<b>浜</b>のある地点、狼煙は<b>眺望</b>のある地点、井戸は<b>水場</b>でないと作れない。移すと建てたものは失う。</p>'+
   '<p class="memo"><b>ゲージはない</b>　いかだや小屋が建っていく風景が、そのまま進み具合。'+
   '体の具合は上のアイコン、心の具合は<b>画面の色</b>で分かる。</p>'+
   '<p class="memo"><b>四十日</b>　嵐が来る前に決断を。決めなければ、海が決める。'+
   '<b>死ねば終わり</b>。持ち越せるのは図鑑の知識だけ。</p>'+
   '<button class="close" data-x="1">とじる</button>');
}
function startRun(){
  newRun();
  curtain.classList.remove('on'); scrim.classList.remove('on'); uiOpen=false;
  document.body.classList.remove('mapmode');
  resize(); drawHUD(); drawLog(); audioInit(); audioUpdate();
  $('fade').classList.remove('on');
}
function curtainEnd(E,isDeath){
  document.body.classList.remove('mapmode');
  $('fade').classList.add('on');
  setTimeout(()=>{
    const vis=S.world.locs.filter(l=>l.visited).length;
    curtain.innerHTML=
      '<div class="endkind" style="color:'+(isDeath?'#8d8378':'#e2c98a')+'">'+E.k+'</div>'+
      '<div class="endtitle">'+E.n+'</div>'+
      '<div class="desc" style="margin-top:22px;white-space:pre-line">'+E.t+'</div>'+
      '<div class="desc" style="font-size:11.5px;color:#6f6a5e;letter-spacing:.1em">'+
        S.day+'日目　／　巡った地点 '+vis+' / '+S.world.locs.length+'　／　遺構 '+S.ruins+'/3'+
        (S.helped?'　／　助けた人 '+S.helped:'')+'</div>'+
      '<button class="btn" data-t="again">も う 一 度 漂 着 す る</button>'+
      '<button class="btn sm" data-t="codex">図鑑</button>'+
      '<button class="btn sm" data-t="title">タイトルへ</button>';
    curtain.classList.add('on');
    $('fade').classList.remove('on');
  },1200);
}

/* ───────── 起動 ───────── */
resize(); draw(); showTitle();
</script>
</body>
</html>
